<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="liquid-glass.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#d6f23f;--lime:#d6f23f;--on-lime:#1a1c17;--bg:#eceef0;--body-bg:#e6e8eb;--surface:#fff;--surface-soft:#f3f4f6;--ink:#232427;--ink2:#2a2b2e;--muted:#8d9097;--muted2:#b3b6bc;--border:#f1f2f4}
[data-theme="dark"]{--bg:#1a1b1e;--body-bg:#111214;--surface:#242528;--surface-soft:#2e2f32;--ink:#f0f1f3;--ink2:#e4e6e9;--muted:#8d9097;--muted2:#6a6d74;--border:#2e3033}
html{background:var(--body-bg)}
body{margin:0;background:var(--body-bg)}
.app{width:100%;max-width:1560px;margin:0 auto;min-height:100vh;background:var(--bg);font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);padding:22px 26px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.ink{color:var(--ink)}.mut{color:var(--muted)}.mut2{color:var(--muted2)}.wht{color:#fff}
.mono{font-family:'JetBrains Mono',monospace}
.fs10{font-size:10px}.fs13{font-size:13px}
.lime{background:var(--ac,#d6f23f);color:#222}
.pillb{background:var(--surface-soft);color:#74767c}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;font-size:11.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.shell{display:flex;gap:22px;align-items:flex-start}
.side{width:244px;flex:none;position:sticky;top:22px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.3px;padding:6px 8px 2px}
.logodot{width:17px;height:17px;border-radius:50%;background:#232427;display:inline-block}
.nav{display:flex;flex-direction:column;gap:7px}
.navitem{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;padding:12px 15px;cursor:pointer;border:1px solid transparent;transition:background .15s,transform .1s}
.navitem:hover{background:var(--surface-soft);transform:translateX(2px)}
.navitem.on{background:var(--ink)}
.navitem.on .nlabel{color:#fff}
.navitem.on .nicon{color:var(--ac,#d6f23f)}
.navitem.on .nmeta{color:#8a8c90}
.ngrp{display:flex;align-items:center;gap:11px}
.nicon{color:#5b5d63;display:flex}
.nlabel{font-size:14px;font-weight:500}
.nmeta{font-size:12px;color:#a9acb2;font-weight:500}
.sidefoot{background:var(--surface);border-radius:20px;padding:16px;position:relative}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:42px}
.crumb{font-size:13.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:9px}
.brandmob{display:none;align-items:center;gap:8px;font-size:16px;font-weight:700}
.topicons{display:flex;align-items:center;gap:10px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.laycol{display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.greet{font-size:44px;font-weight:600;letter-spacing:-1.3px;line-height:1}
.subtitle{font-size:15px;color:var(--muted);margin-top:10px}
.statrow{display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;align-items:flex-start;gap:9px}
.statnum{color:var(--ink2);font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1}
.statside{display:flex;flex-direction:column;gap:5px;padding-top:2px}
.statlabel{font-size:12.5px;color:var(--muted);font-weight:500;line-height:1.15}
.progcard{background:var(--surface);border-radius:26px;padding:22px 26px}
.progtop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.progbig{font-size:36px;font-weight:600;letter-spacing:-1.2px;margin:2px 0 4px;display:flex;align-items:baseline;gap:10px}
.progarrow{color:var(--muted2)}
.progunit{font-size:17px;color:var(--muted);font-weight:500}
.progbar{height:11px;border-radius:6px;background:var(--surface-soft);position:relative;margin:20px 0}
.progfill{height:100%;border-radius:6px;background:linear-gradient(90deg,#5fbf45,#bfe07a);width:33%}
.proghandle{position:absolute;left:33%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.22);border:3px solid #5fbf45}
.progstats{display:flex;gap:46px;flex-wrap:wrap}
.pstat{display:flex;flex-direction:column;gap:7px}
.orbrow{display:grid;grid-template-columns:1fr 1fr 1.05fr;gap:16px}
.orb{position:relative;border-radius:28px;overflow:hidden;min-height:252px;padding:20px;display:flex;flex-direction:column}
.orbgreen{background:#e8ebe2}.orborange{background:#e7e8ea}
.mesh{position:absolute;inset:-25%;filter:blur(36px);z-index:0}
.blob{position:absolute;border-radius:50%}
.blob.l{width:220px;height:220px;background:var(--lime);top:-40px;right:0;opacity:.5}
.blob.f{width:180px;height:180px;background:var(--forest-2);bottom:-60px;right:120px;opacity:.65}
.blob.k{width:140px;height:140px;background:#2f7d59;top:50px;right:200px;opacity:.3}
.hero>*{position:relative;z-index:1}
.hero .htop{display:flex;align-items:flex-start;justify-content:space-between;gap:14px}
.hlab{font-size:11px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:rgba(255,255,255,.45)}
.hero .hday{font-size:30px;font-weight:700;letter-spacing:-.03em;margin-top:7px;line-height:1.06;color:#fff}
.hero .hsub{font-size:13px;color:rgba(255,255,255,.6);font-weight:400;margin-top:7px;max-width:80%;line-height:1.5}
.ring{position:relative;width:72px;height:72px;flex:0 0 auto}
.ring svg{transform:rotate(-90deg)}
.ring .fil{transition:stroke-dashoffset .6s cubic-bezier(.2,.7,.2,1)}
.ring .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.ring .rt b{font-size:15px;font-weight:700;line-height:1;color:#fff}
.ring .rt span{font-size:8px;color:rgba(255,255,255,.45);font-weight:600;text-transform:uppercase;letter-spacing:.05em;margin-top:2px}
.hchips{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.hchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.14);padding:8px 13px;border-radius:12px;font-size:12px;font-weight:500;color:rgba(255,255,255,.8)}
.hchip b{font-weight:700;font-size:13px;color:#fff}
.herostats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-top:20px}
.hs .v{font-size:18px;font-weight:700;letter-spacing:-.02em;color:#fff}
.hs .k{font-size:10px;color:rgba(255,255,255,.45);font-weight:500;text-transform:uppercase;letter-spacing:.05em;margin-top:3px}
.hs .bar{height:3px;border-radius:3px;background:rgba(255,255,255,.14);margin-top:8px;overflow:hidden}
.hs .bar i{display:block;height:100%;background:var(--lime);border-radius:3px}
.bignum{font-size:48px;font-weight:700;letter-spacing:-.04em;line-height:.95}
.bignum small{font-size:17px;font-weight:500;color:var(--muted);letter-spacing:0}
.bigsub{font-size:13px;font-weight:400;color:var(--muted);margin-top:6px}

/* ── Dashboard grid ── */
.dash{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dash .hero{grid-column:1/-1}
.dash .calendar{display:none}

/* ── Pills / segmented ── */
.pills{display:flex;gap:8px;overflow-x:auto;padding:4px 4px 6px;-ms-overflow-style:none;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.pill{flex:0 0 auto;border:none;background:var(--card);color:var(--muted);font-size:13px;font-weight:500;padding:8px 16px;border-radius:20px;transition:.15s;white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.08),0 0 0 1px var(--hair)}
.pill:active{transform:scale(.95)}
.pill.active{background:var(--lime);color:var(--on-lime);font-weight:600}

/* ── Calendar ── */
.calendar{background:var(--ink);color:var(--on-ink);border-radius:var(--r-xl);padding:20px;box-shadow:var(--shadow)}
.calendar .calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.calendar .calh b{font-size:15px;font-weight:600}
.calendar .calh .pill{background:rgba(255,255,255,.1);color:#fff;font-size:11px;padding:5px 11px;box-shadow:none;border:none}
.caldow,.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}
.caldow span{text-align:center;font-size:10px;font-weight:600;color:rgba(255,255,255,.35);padding-bottom:5px}
.cal-d{aspect-ratio:1;display:grid;place-items:center;font-size:12px;font-weight:500;border-radius:50%;color:rgba(255,255,255,.8);position:relative}
.cal-empty{visibility:hidden}
.cal-done{background:var(--lime);color:var(--on-lime);font-weight:700}
.cal-part{background:linear-gradient(135deg,var(--lime) 50%,rgba(255,255,255,.1) 50%);color:#fff;font-weight:700}
.cal-today{border:2px solid var(--lime);color:#fff;font-weight:700}
.cal-sched{background:rgba(255,255,255,.07);color:rgba(255,255,255,.45)}
.callegend{display:flex;gap:12px;margin-top:14px;flex-wrap:wrap}
.callegend span{display:flex;align-items:center;gap:5px;font-size:11px;font-weight:500;color:rgba(255,255,255,.5)}
.callegend i{width:9px;height:9px;border-radius:50%;display:block}

/* ── Workout ── */
.whead{display:flex;align-items:center;gap:10px;padding:2px 4px 0}
.whead .tg{font-size:11px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;padding:5px 10px;border-radius:8px;background:var(--lime);color:var(--on-lime)}
.whead .wt{font-size:16px;font-weight:600;color:var(--text)}
.whead .wm{margin-left:auto;font-size:12px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:4px}
.wlist{display:flex;flex-direction:column;gap:8px}
.exrow{display:flex;align-items:flex-start;gap:12px;padding:14px;background:var(--card);border-radius:var(--r-sm);box-shadow:var(--shadow-card);transition:.18s}
.exbody{flex:1;min-width:0}
.en{display:flex;gap:8px;align-items:baseline}
.enum{font-size:12px;font-weight:500;color:var(--muted2);min-width:16px}
.ename{font-size:15px;font-weight:600;letter-spacing:-.01em;color:var(--text);text-decoration:none;display:inline-flex;align-items:center;gap:7px}
.ename .play{flex:0 0 auto;width:18px;height:18px;border-radius:6px;background:var(--lime);display:grid;place-items:center}
.ename .play i{font-size:9px;color:var(--on-lime)}
.exmeta{display:flex;flex-wrap:wrap;gap:5px;margin:9px 0 0 24px}
.mp{font-size:11px;font-weight:500;padding:3px 8px;border-radius:6px;background:var(--panel);color:var(--text)}
.mp.load{background:color-mix(in srgb,var(--lime) 18%,var(--panel));color:var(--text)}
.mp.rir{background:color-mix(in srgb,var(--forest) 12%,var(--panel));color:var(--forest)}
[data-theme="dark"] .mp.rir{background:color-mix(in srgb,var(--lime) 12%,var(--panel));color:var(--lime)}
.exnote{font-size:12px;color:var(--muted);margin:7px 0 0 24px;font-weight:400;line-height:1.5}
.exchk{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;transition:.18s;margin-top:1px}
.exchk i{font-size:15px}
.exchk:active{transform:scale(.82)}
.exrow.done{background:color-mix(in srgb,var(--lime) 8%,var(--card))}
.exrow.done .exchk{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}
.exrow.done .ename{color:var(--muted)}
.exrow.done .ename .play{background:var(--muted2)}

/* ── Checklist ── */
.clist{list-style:none}
.clist li{display:flex;gap:10px;padding:9px 0;font-size:14px;font-weight:400;border-bottom:1px solid var(--hair)}
.clist li:last-child{border-bottom:none;padding-bottom:0}.clist li:first-child{padding-top:0}
.card.ink .clist li,.card.forest .clist li{border-color:rgba(255,255,255,.08);color:rgba(255,255,255,.85)}
.clist li .ck{flex:0 0 auto;width:20px;height:20px;border-radius:50%;background:var(--lime);display:grid;place-items:center;color:var(--on-lime);margin-top:1px}
.clist li .ck i{font-size:12px}
.clist li b{font-weight:600}

/* ── Progress weeks ── */
.pweek{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--hair)}
.pweek:last-child{border-bottom:none;padding-bottom:0}.pweek:first-child{padding-top:0}
.pweek .wk{flex:0 0 auto;width:44px;font-size:11px;font-weight:600;color:var(--muted)}
.pweek .sets{display:flex;gap:5px;flex-wrap:wrap}
.setc{font-size:11px;font-weight:500;padding:3px 7px;border-radius:6px;background:var(--panel);color:var(--text);font-variant-numeric:tabular-nums}
.setc.top{background:var(--lime);color:var(--on-lime)}
.prule{display:flex;align-items:center;gap:10px;background:var(--forest);color:var(--on-forest);border-radius:12px;padding:12px 14px;margin-top:12px;font-size:13px;font-weight:500}
.prule b{font-weight:700;color:#fff}
.prule .arr{flex:0 0 auto;width:24px;height:24px;border-radius:8px;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-weight:800}

/* ── Macros / Nutrition ── */
.macrobar{display:flex;gap:10px;margin-top:14px}
.mb{flex:1;text-align:center}
.mb .v{font-size:22px;font-weight:700;letter-spacing:-.02em}
.mb .v small{font-size:12px;color:var(--muted);font-weight:400}
.mb .l{font-size:11px;font-weight:500;color:var(--muted);margin-top:2px}
.modetog{display:flex;gap:2px;background:var(--panel);border-radius:12px;padding:3px}
.modetog button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:500;font-size:13px;padding:9px;border-radius:9px;transition:.15s}
.modetog button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow-card)}
.meal{background:var(--card);border-radius:var(--r-sm);padding:14px;box-shadow:var(--shadow-card)}
.meal-h{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;gap:10px}
.meal-h .t{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
.meal-h .k{font-size:12px;color:var(--muted);font-weight:500;white-space:nowrap}
.meal .fd{font-size:13px;font-weight:400;color:var(--text);line-height:1.5}
.m2{display:flex;gap:12px;margin-top:9px;padding-top:9px;border-top:1px solid var(--hair)}
.mtime{display:flex;align-items:center;gap:7px;margin-bottom:8px;flex-wrap:wrap}
.mt-time{font-size:11px;font-weight:600;letter-spacing:.01em;color:var(--on-lime);background:var(--lime);padding:3px 8px;border-radius:6px;font-variant-numeric:tabular-nums}
.mt-slot{font-size:11px;font-weight:500;color:var(--muted)}
.malts{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.malt-l{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.malt{font-size:12px;font-weight:500;color:var(--text);background:var(--panel);padding:3px 8px;border-radius:7px}
.malt i{font-style:normal;font-weight:500;color:var(--muted);font-size:10px;margin-left:3px;font-variant-numeric:tabular-nums}
.m2 span{font-size:12px;color:var(--muted);font-weight:500}
.m2 b{color:var(--text);font-weight:600}
.totbar{display:flex;justify-content:space-between;align-items:center;border-radius:var(--r-sm);padding:13px 16px;font-size:12px;font-weight:500;background:var(--panel)}
.totbar.ok{background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.totbar .m{font-weight:600}
.totbar.ok .m{color:var(--ok)}
.medit{display:flex;flex-direction:column;gap:8px}
.medit input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:14px;font-weight:500;padding:10px 11px;border-radius:10px}
.medit .nm{font-weight:600}
.medit .pcf{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}
.medit .pcf .fl{position:relative}
.medit .pcf .fl span{position:absolute;left:10px;top:8px;font-size:10px;font-weight:500;color:var(--muted2);text-transform:uppercase;pointer-events:none}
.medit .pcf input{padding:20px 10px 7px;text-align:left}
.medit .delm{align-self:flex-end;border:none;background:var(--panel);color:var(--warn);font-weight:600;font-size:12px;padding:6px 11px;border-radius:8px}
.addrow{display:flex;gap:8px}
.btn{border:none;background:var(--panel);color:var(--text);font-weight:500;font-size:14px;padding:14px;border-radius:var(--r-sm);flex:1;transition:.15s}
.btn:active{transform:scale(.98);opacity:.8}
.btn.solid{background:var(--lime);color:var(--on-lime);font-weight:600}
.btn.ghost{border:1.5px solid var(--line);background:transparent}

/* ── Schedule cards ── */
.plist{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden}
.pc{display:flex;align-items:center;gap:12px;background:var(--card);padding:13px 15px}
.pc:first-child{border-radius:var(--r-sm) var(--r-sm) 0 0}
.pc:last-child{border-radius:0 0 var(--r-sm) var(--r-sm)}
.pc:only-child{border-radius:var(--r-sm)}
.pc-d{flex:0 0 auto;width:38px;text-align:center}
.pc-d b{font-size:14px;font-weight:600;display:block}
.pc-d small{font-size:10px;color:var(--muted2);text-transform:uppercase;font-weight:500}
.pc-bar{flex:0 0 auto;width:3px;align-self:stretch;border-radius:3px;background:var(--lime)}
.pc-bar.r{background:var(--line)}.pc-bar.h{background:var(--forest)}
.pc-i{flex:1;min-width:0}
.pc-i .t{font-size:14px;font-weight:600}
.pc-i .s{font-size:12px;color:var(--muted2);font-weight:400;margin-top:1px}
.pc.r .pc-i .t{color:var(--muted)}

/* ── Phases ── */
.phase{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--r-sm);padding:13px 15px;box-shadow:var(--shadow-card)}
.phase .pn{flex:0 0 auto;width:30px;height:30px;border-radius:9px;background:var(--panel);color:var(--text);font-weight:700;display:grid;place-items:center;font-size:14px}
.phase .pm{flex:1}.phase .pm .t{font-size:14px;font-weight:600}.phase .pm .s{font-size:12px;color:var(--muted2);font-weight:400;margin-top:1px}
.phase .pt{font-size:14px;font-weight:700;color:var(--ok)}
[data-theme="dark"] .phase .pt{color:var(--lime)}

/* ── Priority cards ── */
.prio{display:flex;gap:14px;background:var(--card);border-radius:var(--r);padding:20px;box-shadow:var(--shadow-card);align-items:flex-start}
.prio .pn{flex:0 0 auto;width:36px;height:36px;border-radius:10px;background:var(--lime);color:var(--on-lime);font-size:17px;font-weight:700;display:grid;place-items:center}
.prio .pt{font-size:11px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.prio h3{font-size:18px;font-weight:700;letter-spacing:-.02em;margin:4px 0 8px}
.prio p{font-size:13px;font-weight:400;color:var(--text);line-height:1.6}
.prio .nlist{list-style:none}
.prio .nlist li{font-size:13px;font-weight:500;padding:3px 0 3px 16px;position:relative;color:var(--text)}
.prio .nlist li::before{content:"";position:absolute;left:0;top:11px;width:6px;height:2px;border-radius:2px;background:var(--lime)}

/* ── Segmented controls (iOS style) ── */
.seg{display:flex;gap:2px;background:var(--panel);border-radius:12px;padding:3px}
.seg button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:500;font-size:13px;padding:9px;border-radius:9px;transition:.15s}
.seg button.on{background:var(--card);color:var(--text);font-weight:600;box-shadow:var(--shadow-card)}
.pane{display:none}.pane.on{display:flex;flex-direction:column;gap:12px;animation:rise .3s ease both}
.prog-cols{display:flex;flex-direction:column;gap:12px}
.prog-main,.prog-side{display:flex;flex-direction:column;gap:12px}
.setgrid,.setcol{display:flex;flex-direction:column;gap:12px}

/* ── Charts ── */
.chartcard{background:var(--card);border-radius:var(--r);padding:16px;box-shadow:var(--shadow-card)}
.chartcard svg{width:100%;height:auto;display:block}
.c-grid{stroke:var(--line);stroke-width:1}
.c-avg{stroke:color-mix(in srgb,var(--lime) 60%,transparent);stroke-width:1.5;stroke-dasharray:4 4}
.c-line{fill:none;stroke:var(--lime-deep);stroke-width:2.5;stroke-linecap:round;stroke-linejoin:round}
.c-area{fill:color-mix(in srgb,var(--lime) 12%,transparent);stroke:none}
.c-pt{fill:var(--card);stroke:var(--lime-deep);stroke-width:2.5}
.c-pt.last{fill:var(--lime-deep)}
.c-v{fill:var(--text);font-size:9px;font-weight:600}
.c-x{fill:var(--muted);font-size:8px;font-weight:500}
[data-theme="dark"] .c-avg{stroke:var(--lime)}
[data-theme="dark"] .c-line{stroke:var(--lime)}
[data-theme="dark"] .c-area{fill:color-mix(in srgb,var(--lime) 14%,transparent)}
[data-theme="dark"] .c-pt{stroke:var(--lime)}
[data-theme="dark"] .c-pt.last{fill:var(--lime)}
.empty{padding:28px 10px;text-align:center;color:var(--muted2);font-size:13px;font-weight:500}
.mchips{display:flex;gap:6px;overflow-x:auto;padding:4px 4px 6px;-ms-overflow-style:none;scrollbar-width:none}
.mchips::-webkit-scrollbar{display:none}

/* ── Verdict ── */
.verdict{border-radius:var(--r-sm);padding:16px;background:var(--panel)}
.verdict.good{background:color-mix(in srgb,var(--ok) 14%,var(--card));color:var(--text)}
.verdict.warn{background:color-mix(in srgb,var(--warn) 10%,var(--card));color:var(--text)}
.verdict .vh{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.verdict .vico{width:20px;height:20px;border-radius:50%;background:var(--muted2);color:#fff;display:grid;place-items:center;font-size:11px;font-weight:700}
.verdict.good .vico{background:var(--ok)}
.verdict.warn .vico{background:var(--warn)}
.verdict .vd{font-size:13px;color:var(--muted);font-weight:400;margin-top:7px;line-height:1.55}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.dcl{background:var(--card);border-radius:var(--r-sm);padding:12px 12px 12px 14px;box-shadow:var(--shadow-card);border-left:3px solid var(--line)}
.dcl.dcl-good{border-left-color:var(--ok);background:var(--ok-bg)}
.dcl.dcl-up{border-left-color:var(--warn);background:var(--warn-bg)}
.dcl .l{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
.dcl .v{font-size:18px;font-weight:700;margin-top:4px;display:flex;align-items:baseline;gap:3px}
.dcl .v.up{color:var(--warn-text)}.dcl .v.good{color:var(--ok-text)}
.dcl .v.up::before{content:'↑ '}.dcl .v.good::before{content:'↓ '}
#dHist,#sHist{display:flex;flex-direction:column;gap:1px;background:var(--line);border-radius:var(--r-sm);overflow:hidden}
.hist{display:flex;align-items:center;gap:12px;background:var(--card);padding:12px 14px}
.hist:first-child{border-radius:var(--r-sm) var(--r-sm) 0 0}
.hist:last-of-type{border-radius:0 0 var(--r-sm) var(--r-sm)}
.hist .hd b{font-size:13px;font-weight:600}.hist .hd small{font-size:11px;color:var(--muted2);font-weight:400;display:block}
.hist .hm{flex:1;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.hist .hm span{font-size:12px;color:var(--muted);font-weight:500}
.hist .hm b{color:var(--text);font-weight:600}
.hist .del{flex:0 0 auto;width:44px;height:44px;border-radius:50%;border:none;background:var(--panel);color:var(--muted);font-size:15px;display:grid;place-items:center}
.addbtn{width:100%;border:none;background:color-mix(in srgb,var(--lime) 14%,var(--panel));color:var(--lime-deep);font-weight:600;font-size:14px;padding:14px;border-radius:var(--r-sm)}
[data-theme="dark"] .addbtn{background:color-mix(in srgb,var(--lime) 12%,var(--panel));color:var(--lime)}
.addbtn:active{opacity:.7}

/* ── Forms ── */
.form{display:none;background:var(--card);border-radius:var(--r-sm);padding:16px;box-shadow:var(--shadow-card)}
.form.open{display:block;animation:rise .25s ease both}
.frow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:8px}
.field label{font-size:11px;color:var(--muted);font-weight:500;text-transform:uppercase;letter-spacing:.04em;display:block;margin-bottom:5px}
.field input{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:15px;font-weight:500;padding:10px 11px;border-radius:10px}
.calc{font-size:12px;color:var(--muted);font-weight:400;margin:2px 0 10px;line-height:1.5}
.formbtns{display:flex;gap:8px}
.ghost{flex:1;border:1px solid var(--line);background:transparent;color:var(--muted);font-weight:500;padding:11px;border-radius:10px}
.save{flex:2;border:none;background:var(--lime);color:var(--on-lime);font-weight:600;padding:11px;border-radius:10px}
.reset{background:none;border:none;color:var(--blue);font-size:13px;font-weight:500;padding:4px 0 0;align-self:center}

/* ── Reference accordion ── */
details.fx{background:var(--card);border-radius:var(--r-sm);overflow:hidden;box-shadow:var(--shadow-card)}
details.fx summary{padding:14px 16px;font-size:14px;font-weight:600;cursor:default;list-style:none;pointer-events:none;color:var(--text)}
details.fx summary::-webkit-details-marker{display:none}
details.fx summary::after{display:none}
details.fx[open] summary::after{content:"\2212"}
details.fx .fb{padding:0 16px 14px;font-size:13px;color:var(--muted);font-weight:400;line-height:1.6}
details.fx .eq{background:var(--bg);border-radius:8px;padding:8px 10px;font-size:12px;font-weight:500;color:var(--text);margin:5px 0;font-variant-numeric:tabular-nums}
.eq b{color:var(--ok)}
[data-theme="dark"] .eq b{color:var(--lime)}

/* ── Settings: macros ── */
.stepper{display:flex;align-items:center;justify-content:space-between;padding:13px 0;border-bottom:1px solid var(--hair)}
.stepper:last-of-type{border-bottom:none}
.stepper .sl{font-size:15px;font-weight:500}
.stepper .sl small{display:block;font-size:12px;color:var(--muted);font-weight:400}
.stepctl{display:flex;align-items:center;gap:8px}
.stepctl button{width:44px;height:44px;border-radius:50%;border:none;background:var(--panel);color:var(--text);font-size:20px;font-weight:600;display:grid;place-items:center;line-height:1}
.stepctl input{width:64px;text-align:center;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:17px;font-weight:600;padding:7px 4px;border-radius:10px}
.kcalrow{display:flex;justify-content:space-between;align-items:center;margin-top:14px;background:var(--ink);color:var(--on-ink);border-radius:12px;padding:13px 16px}
.kcalrow .kn{font-size:22px;font-weight:700;color:var(--lime)}
.kcalrow .kl{font-size:11px;font-weight:500;color:rgba(255,255,255,.55);text-transform:uppercase;letter-spacing:.05em}
.deficitrow{display:flex;gap:8px;margin-top:10px}
.sgroup h3{font-size:13px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin-bottom:10px;padding:0 2px}
.seg2{display:flex;gap:2px;background:var(--panel);border-radius:12px;padding:3px}
.seg2 button{flex:1;border:none;background:transparent;color:var(--muted);font-weight:500;font-size:13px;padding:10px;border-radius:9px}
.seg2 button.on{background:var(--lime);color:var(--on-lime);font-weight:600}
.swatches{display:flex;gap:10px}
.sw{width:40px;height:40px;border-radius:14px;border:3px solid transparent;transition:.15s}
.sw.on{border-color:var(--text);transform:scale(1.08)}
.backup textarea{width:100%;border:1px solid var(--line);background:var(--bg);color:var(--text);font-size:12px;font-weight:400;padding:10px;border-radius:10px;resize:vertical;min-height:60px;font-family:ui-monospace,monospace;word-break:break-all}

/* ── Toast ── */
.toast{position:fixed;left:50%;bottom:calc(108px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px);background:rgba(30,30,32,.92);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);color:#fff;padding:11px 18px;border-radius:14px;font-size:13px;font-weight:600;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:.28s;z-index:100}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

/* ── Footer ── */
.foot{padding:4px 2px 0}
.foot p{font-size:12px;color:var(--muted);font-weight:400;margin-bottom:6px;line-height:1.55}
.foot b{color:var(--text);font-weight:600}

/* ── Progress scale path ── */
.proj-top{display:flex;flex-wrap:wrap;gap:14px 24px;margin-bottom:16px}
.proj-stat{display:flex;flex-direction:column;gap:3px;flex:1 1 120px;min-width:0}
.ps-l{font-size:11px;font-weight:500;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.ps-v{font-size:17px;font-weight:700;line-height:1.15}
.ps-v small{font-size:12px;color:var(--muted);font-weight:500}
.proj-lbl{font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);margin-bottom:10px}
.proj-weeks{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:8px}
.pw{background:var(--panel);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:3px}
.pw-n{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.pw-d{font-size:11px;font-weight:500;color:var(--text)}
.pw-v{font-size:18px;font-weight:700;line-height:1}
.pw-v::after{content:' kg';font-size:10px;color:var(--muted);font-weight:500}
.pw-f{font-size:11px;font-weight:500;color:var(--muted)}
.pw.goal{background:color-mix(in srgb,var(--lime) 18%,var(--panel))}
.proj-note{margin-top:14px;font-size:13px;font-weight:400;color:var(--muted)}

/* ── Tab bar + pill: see liquid-glass.css ── */
@media (prefers-reduced-motion:reduce){.tab,.tab svg{transition:none}}

/* ── Desktop sidebar ── */
@media(min-width:980px){
  .sidebar{display:flex;flex-direction:column;align-items:center;gap:4px;position:fixed;top:0;left:0;bottom:0;width:82px;padding:22px 0;background:rgba(242,242,247,.82);-webkit-backdrop-filter:blur(32px) saturate(180%);backdrop-filter:blur(32px) saturate(180%);border-right:1px solid rgba(60,60,67,.12);z-index:50}
  [data-theme="dark"] .sidebar{background:rgba(0,0,0,.6);border-color:rgba(255,255,255,.08)}
  .sidebar .logo{width:42px;height:42px;margin-bottom:16px}
  .sb-item{width:62px;padding:10px 0;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:4px;color:var(--muted);background:transparent;border:none;transition:color .18s;position:relative;z-index:2}
  .sbpill{position:absolute;left:0;top:0;width:0;height:0;border-radius:16px;z-index:1;pointer-events:none;background:color-mix(in srgb,var(--lime) 60%,transparent);border:1px solid rgba(255,255,255,.4);transition:none}
  [data-theme="dark"] .sbpill{background:color-mix(in srgb,var(--lime) 28%,transparent);border-color:color-mix(in srgb,var(--lime) 35%,transparent)}
  body.nav-anim .sbpill{transition:transform .38s cubic-bezier(.34,1.28,.46,1),width .28s,height .38s cubic-bezier(.34,1.28,.46,1)}
  .sb-item .sl{font-size:9px;font-weight:600;letter-spacing:.02em;text-transform:uppercase}
  .sb-item:hover{background:color-mix(in srgb,var(--text) 6%,transparent);color:var(--text)}
  .sidebar{display:flex;flex-direction:column;align-items:center;gap:6px;position:fixed;top:0;left:0;bottom:0;width:88px;padding:24px 0;background:var(--glass);-webkit-backdrop-filter:blur(28px) saturate(180%);backdrop-filter:blur(28px) saturate(180%);border-right:1px solid var(--glass-brd);z-index:50;box-shadow:inset -1px 0 0 rgba(255,255,255,.06)}
  .sidebar .logo{width:46px;height:46px;margin-bottom:18px}
  .sb-item{width:66px;padding:11px 0;border-radius:20px;display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);background:transparent;border:none;transition:color .2s;position:relative;z-index:2}
  .sbpill{position:absolute;left:0;top:0;width:0;height:0;border-radius:20px;z-index:1;pointer-events:none;background:color-mix(in srgb,var(--lime) 64%,transparent);border:1px solid rgba(255,255,255,.5);box-shadow:inset 0 1.5px 1px rgba(255,255,255,.6),inset 0 -1px 2px color-mix(in srgb,var(--lime) 45%,transparent),0 3px 10px color-mix(in srgb,var(--lime) 32%,transparent);transition:none}
  [data-theme="dark"] .sbpill{background:color-mix(in srgb,var(--lime) 30%,transparent);border-color:color-mix(in srgb,var(--lime) 38%,transparent);box-shadow:inset 0 1px 1px rgba(255,255,255,.22),0 2px 10px color-mix(in srgb,var(--lime) 20%,transparent)}
  body.nav-anim .sbpill{transition:translate .42s cubic-bezier(.34,1.3,.46,1),width .3s,height .42s cubic-bezier(.34,1.3,.46,1)}
  .sb-item svg{width:21px;height:21px}
  .sb-item .sl{font-size:8.5px;font-weight:700;letter-spacing:.03em;text-transform:uppercase}
  .sb-item:hover{background:color-mix(in srgb,var(--text) 7%,transparent);color:var(--text)}
  .sb-item.active{color:var(--on-lime)}
  [data-theme="dark"] .sb-item.active{color:var(--lime)}
  .sb-spacer{flex:1}
  .sb-avatar{width:40px;height:40px;border-radius:50%;background:var(--lime);color:var(--on-lime);display:grid;place-items:center;font-weight:700;font-size:16px;margin-top:6px}
  .tabbar{display:none}
  .main{margin-left:82px;max-width:none;padding:0 40px 52px;width:auto}
  .topbar{padding:30px 0 12px;background:transparent;position:static;border-bottom:none}
  .brand{display:none}
  .tttext{display:block}
  .tttext b{font-size:26px;font-weight:700;letter-spacing:-.03em;display:block;line-height:1}

/* ── Nutrition desktop ── */
.fuel-desktop{display:none}
.fcols{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.fcol{display:flex;flex-direction:column;gap:10px}
.fcolcard{background:var(--card);border-radius:var(--r);padding:18px;box-shadow:var(--shadow-card)}
.fcol-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:4px}
.fcol-h .ft{font-size:16px;font-weight:600;letter-spacing:-.02em}
.fcol-h .fd{font-size:12px;font-weight:500;color:var(--muted)}
.fcol .bignum{font-size:36px}
.fcol .meal{border-radius:var(--r-sm)}
.fcoltot{display:flex;justify-content:space-between;align-items:center;border-radius:var(--r-sm);padding:12px 14px;font-size:12px;font-weight:500;background:var(--panel)}
.fcoltot.ok{background:color-mix(in srgb,var(--ok) 10%,var(--panel))}
.fcoltot .m{font-weight:600}.fcoltot.ok .m{color:var(--ok)}
.fcol.weekend .fcolcard,.fcol.weekend .meal{background:color-mix(in srgb,var(--lime) 10%,var(--card))}
.fcol.weekend .fcoltot{background:color-mix(in srgb,var(--lime) 8%,var(--panel))}
@media(min-width:980px){.fuel-mobile{display:none}.fuel-desktop{display:block}}

/* week calendar strip */
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.wd{text-align:center;background:var(--panel);border-radius:12px;padding:11px 2px 9px}
.wd .dn{font-size:9px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted2);font-weight:600}
.wd .dd{font-size:15px;font-weight:700;margin-top:3px}
.wd .pip{width:5px;height:5px;border-radius:50%;background:var(--lime);margin:7px auto 0}
.wd .pip.r{background:var(--line)}.wd .pip.h{background:var(--forest)}

/* ══════════════════════════════════════════════════
   GorillaFit-inspired revamp — mobile dark vibe
══════════════════════════════════════════════════ */

/* Force aggressive dark for mobile workout feel */
@media(max-width:767px){
  [data-theme="dark"] body{--bg:#080808;--card:#141414;--panel:#1E1E1E;--card2:#141414;--ink:#1A1A1E}
}

/* ── Exercise cards (image + gradient thumbnails) ── */
.excard{display:flex;align-items:stretch;border-radius:16px;overflow:hidden;background:var(--card);min-height:86px;box-shadow:var(--shadow-card);transition:opacity .15s,transform .15s}
.excard:active{transform:scale(.98);opacity:.8}
.excard.done{opacity:.55}
.excard-thumb{flex:0 0 86px;width:86px;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;overflow:hidden}
.excard-thumb img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center top;transition:opacity .2s}
/* Exercise GIF modal */
.ex-modal{position:fixed;inset:0;z-index:200;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55);opacity:0;pointer-events:none;transition:opacity .22s;-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.ex-modal.open{opacity:1;pointer-events:auto}
.ex-modal-box{width:100%;max-width:480px;background:var(--card);border-radius:28px 28px 0 0;padding:0 0 env(safe-area-inset-bottom);overflow:hidden;transform:translateY(60px);transition:transform .28s cubic-bezier(.32,1,.5,1)}
.ex-modal.open .ex-modal-box{transform:translateY(0)}
.ex-modal-media{width:100%;height:260px;background:#fff;position:relative;overflow:hidden;cursor:pointer;display:flex;align-items:center;justify-content:center}
[data-theme="dark"] .ex-modal-media{background:#000}
.ex-modal-media>#exModalImg{position:relative;z-index:1;max-width:100%;max-height:100%;width:auto;height:auto;object-fit:contain;display:block;image-rendering:-webkit-optimize-contrast;image-rendering:crisp-edges}
.ex-modal-media .play-hint{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);transition:opacity .2s}
.ex-modal-media .play-hint i{font-size:48px;color:#fff;opacity:.9}
.ex-modal-media.playing .play-hint{opacity:0;pointer-events:none}
.ex-modal-info{padding:18px 20px 22px}
.ex-modal-title{font-size:19px;font-weight:800;letter-spacing:-.025em;margin-bottom:4px}
.ex-modal-note{font-size:13px;color:var(--muted);line-height:1.5;margin-top:8px}
.ex-modal-close{position:absolute;top:14px;right:14px;width:32px;height:32px;border-radius:50%;background:rgba(0,0,0,.45);border:none;color:#fff;font-size:16px;display:grid;place-items:center;z-index:10;cursor:pointer}
.excard-thumb-ov{position:absolute;inset:0;background:rgba(0,0,0,.38)}
.excard-thumb i{position:relative;z-index:1;font-size:26px;width:26px;height:26px;color:rgba(255,255,255,.85)}
.excard-tnum{position:relative;z-index:1;font-size:9px;font-weight:700;color:rgba(255,255,255,.4);letter-spacing:.04em;margin-top:5px;text-transform:uppercase}
.cat-legs{background:linear-gradient(145deg,#0d0026 0%,#3a0080 100%)}
.cat-hinge{background:linear-gradient(145deg,#1a0a00 0%,#8b3a00 100%)}
.cat-push{background:linear-gradient(145deg,#1a000a 0%,#8b0038 100%)}
.cat-pull{background:linear-gradient(145deg,#001a2e 0%,#004a8b 100%)}
.cat-delts{background:linear-gradient(145deg,#0d0033 0%,#4a0099 100%)}
.cat-arms{background:linear-gradient(145deg,#1a0020 0%,#7d0077 100%)}
.cat-core{background:linear-gradient(145deg,#00180a 0%,#005a20 100%)}
.excard-body{flex:1;min-width:0;padding:12px 10px 12px 14px;display:flex;flex-direction:column;justify-content:center;gap:5px}
.excard-name{font-size:15px;font-weight:700;letter-spacing:-.02em;color:var(--text);text-decoration:none;display:flex;align-items:center;gap:7px;line-height:1.2;background:none;border:none;padding:0;text-align:left;cursor:pointer;width:100%}
.excard-name .play{flex:0 0 auto;width:18px;height:18px;border-radius:6px;background:var(--lime);display:grid;place-items:center}
.excard-name .play i{font-size:9px;color:var(--on-lime)}
.excard-tags{display:flex;flex-wrap:wrap;gap:5px}
.excard-tag{font-size:11px;font-weight:600;padding:3px 8px;border-radius:6px;background:var(--panel);color:var(--muted)}
.excard-tag.lime{background:color-mix(in srgb,var(--lime) 18%,var(--panel));color:var(--text)}
.excard-tag.rir{color:var(--lime);background:color-mix(in srgb,var(--lime) 10%,var(--panel))}
.excard-enote{font-size:11px;color:var(--muted);line-height:1.35;display:-webkit-box;-webkit-line-clamp:1;-webkit-box-orient:vertical;overflow:hidden}
.excard.done .excard-name{color:var(--muted)}
.excard-chk{flex:0 0 auto;align-self:center;width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;color:transparent;margin:0 12px;transition:.18s}
.excard-chk i{font-size:14px}
.excard-chk:active{transform:scale(.82)}
.excard.done .excard-chk{background:var(--lime);border-color:var(--lime);color:var(--on-lime)}

/* ── Activity rings card (GorillaFit vibe) ── */
.actcard{background:var(--ink);color:var(--on-ink);border-radius:var(--r-xl);padding:22px 20px 20px;box-shadow:var(--shadow)}
.actcard-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.actcard-head h3{font-size:17px;font-weight:700;letter-spacing:-.02em;color:#fff}
.actcard-label{font-size:11px;font-weight:700;color:var(--lime);letter-spacing:.04em;text-transform:uppercase}
.actring-main{display:flex;justify-content:center;margin-bottom:20px}
.actring-main .ringwrap{position:relative;width:148px;height:148px}
.actring-main .ringwrap svg{transform:rotate(-90deg);width:148px;height:148px}
.actring-main .ringwrap .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.actring-main .ringwrap .rt b{font-size:30px;font-weight:800;letter-spacing:-.04em;color:#fff;line-height:1}
.actring-main .ringwrap .rt span{font-size:10px;color:rgba(255,255,255,.4);font-weight:600;text-transform:uppercase;letter-spacing:.08em;margin-top:4px}
.actring-mini-row{display:flex;justify-content:space-around;gap:8px}
.actring-mini{display:flex;flex-direction:column;align-items:center;gap:7px}
.actring-mini .ringwrap{position:relative;width:74px;height:74px}
.actring-mini .ringwrap svg{transform:rotate(-90deg);width:74px;height:74px}
.actring-mini .ringwrap .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.actring-mini .ringwrap .rt b{font-size:15px;font-weight:700;color:#fff;line-height:1}
.actring-mini .ringwrap .rt span{font-size:7px;color:rgba(255,255,255,.38);font-weight:600;text-transform:uppercase;letter-spacing:.04em;margin-top:1px}
.actring-mini .rl{font-size:11px;font-weight:600;color:rgba(255,255,255,.5);text-align:center}

/* ── Macro rings (Nutrition) ── */
.macro-rings{display:flex;justify-content:space-around;margin-top:16px;padding-top:16px;border-top:1px solid var(--hair);gap:6px}
.macro-ring{display:flex;flex-direction:column;align-items:center;gap:6px}
.macro-ring .ringwrap{position:relative;width:70px;height:70px}
.macro-ring .ringwrap svg{transform:rotate(-90deg);width:70px;height:70px}
.macro-ring .ringwrap .rt{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center}
.macro-ring .ringwrap .rt b{font-size:13px;font-weight:700;line-height:1;color:var(--text)}
.macro-ring .ringwrap .rt small{font-size:8px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;margin-top:2px}
.macro-ring .rl{font-size:11px;font-weight:600;color:var(--muted)}



/* ── Enhanced workout hero ── */
.wday-head{font-size:32px;font-weight:800;letter-spacing:-.04em;color:#fff;line-height:1.05;margin-top:6px}
.wday-sub{font-size:13px;color:rgba(255,255,255,.55);margin-top:5px}

<script>
/* ── utils ── */
var $=function(id){return document.getElementById(id);};
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}

/* ── clean numerals (replaces dot-matrix) ── */
function dots(str,dot){
  var el=document.createElement('div');
  el.className='bignum';
  /* dot param scales font: 3.6→27px, 4→30px, 6→45px, 8→60px */
  el.style.fontSize=Math.round(dot*7.5)+'px';
  el.textContent=String(str);
  return el;
}

/* ── icons ── */
function icon(name){
  var sw='fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round';
  function svg(inner,w,h,vb){var s=document.createElementNS('http://www.w3.org/2000/svg','svg');s.setAttribute('width',w||17);s.setAttribute('height',h||17);s.setAttribute('viewBox',vb||'0 0 20 20');s.innerHTML=inner;return s;}
  switch(name){
    case 'home':return svg('<path style="'+sw+'" d="M4 9l6-5 6 5"/><path style="'+sw+'" d="M5.5 8.5V16h9V8.5"/>');
    case 'dumbbell':return svg('<line style="'+sw+'" x1="5" y1="10" x2="15" y2="10"/><rect style="'+sw+'" x="2.5" y="7" width="3" height="6" rx="1"/><rect style="'+sw+'" x="14.5" y="7" width="3" height="6" rx="1"/>');
    case 'fork':return svg('<path style="'+sw+'" d="M6 3v6a2 2 0 0 0 4 0V3"/><line style="'+sw+'" x1="8" y1="9" x2="8" y2="17"/><path style="'+sw+'" d="M14 3c-1.5 0-2 2-2 4s.5 3 2 3v7"/>');
    case 'chart':return svg('<line style="'+sw+'" x1="5" y1="16" x2="5" y2="10"/><line style="'+sw+'" x1="10" y1="16" x2="10" y2="5"/><line style="'+sw+'" x1="15" y1="16" x2="15" y2="12"/>');
    case 'plan':return svg('<rect style="'+sw+'" x="4" y="4" width="12" height="13" rx="2"/><line style="'+sw+'" x1="7" y1="8" x2="13" y2="8"/><line style="'+sw+'" x1="7" y1="11" x2="11" y2="11"/>');
    case 'user':return svg('<circle style="'+sw+'" cx="10" cy="7" r="3"/><path style="'+sw+'" d="M4.5 16a5.5 5.5 0 0 1 11 0"/>');
    case 'bag':return svg('<path style="'+sw+'" d="M6 7V6a4 4 0 0 1 8 0v1"/><path style="'+sw+'" d="M4.5 7h11l-.8 9.2a1.5 1.5 0 0 1-1.5 1.3H6.8a1.5 1.5 0 0 1-1.5-1.3z"/>');
    case 'moon':return svg('<path style="'+sw+'" d="M16 11.5A6 6 0 1 1 8.5 4a4.6 4.6 0 0 0 7.5 7.5z"/>');
    case 'check':return svg('<path style="'+sw+'" d="M4 10.5l4 4 8-9"/>');
    case 'play':return svg('<path fill="currentColor" d="M3 2l7 4-7 4z"/>',11,11,'0 0 12 12');
    case 'weight':return svg('<line style="'+sw+'" x1="5" y1="16" x2="5" y2="10"/><line style="'+sw+'" x1="10" y1="16" x2="10" y2="5"/><line style="'+sw+'" x1="15" y1="16" x2="15" y2="12"/>');
    case 'drop':return svg('<path style="'+sw+'" d="M10 3c3 4 5 6 5 8.5a5 5 0 0 1-10 0C5 9 7 7 10 3z"/>');
    case 'flame':return svg('<path style="'+sw+'" d="M10 3c2 3 4 4 4 7a4 4 0 0 1-8 0c0-1 .5-2 1.5-3 0 1 .5 1.5 1 1.5C8.5 7 9 5 10 3z"/>');
    case 'spark':return svg('<path style="'+sw+'" d="M10 3v14M3 10h14M5 5l10 10M15 5L5 15"/>');
    default:return svg('<circle style="'+sw+'" cx="10" cy="10" r="6"/>');
  }
}
function iconHTML(name){var el=icon(name);var d=document.createElement('div');d.appendChild(el);return d.innerHTML;}

/* ── workout data ── */
var PROGRAM=[
  {key:'upperA',name:'Upper A',focus:'Heavy push · full chest',sub:'Heavy push &amp; full chest · all 2-set compounds = top set then −10% to failure',time:'~75',ex:[
    {n:'Barbell Bench Press',sr:'2 × 6-8',rir:'2 RIR',ld:'85 → 100kg',q:q('barbell bench press'),note:'Top set at target weight, 1 rep in reserve. Back-off: drop 10%, push to failure. Holding strength through the cut is the win.'},
    {n:'Overhead Press',sr:'2 × 8-10',rir:'1-2 RIR',ld:'50 → 60kg',q:q('standing overhead press barbell'),note:'Strict — no leg drive. Brace hard, ribs down. Top set then −10% back-off.'},
    {n:'Weighted Pull-up / Pulldown',sr:'2 × 8-10',ld:'BW → +10kg',q:q('weighted pull up'),note:'Vertical pull anchor. Top set bodyweight, add load as reps become easy.'},
    {n:'Barbell Bent Over Row',sr:'2 × 8-10',rir:'1-2 RIR',ld:'50 → 65kg',q:q('barbell bent over row'),note:'Hinge to 45°, pull to your sternum, squeeze the shoulder blades together. Horizontal pull anchor of the week.'},
    {n:'Cable Crossovers',sr:'3 × 12-15',ld:'by feel',q:q('high to low cable crossover chest'),note:'Set cables high, cross hands at the bottom. The stretch at the top is what grows the lower chest — do not rush it.'},
    {n:'Lateral Raise',sr:'3 × 12-15',rir:'0-1 RIR',ld:'10 → 16kg',q:q('dumbbell lateral raise'),note:'Delt width is a goal. Strict, lead with the elbow.'},
    {n:'Reverse Grip Triceps Pushdown',sr:'2 × 10-12',ld:'by feel · add a plate',q:q('reverse grip triceps pushdown barbell'),note:'Underhand grip shifts the load to the medial head — the horseshoe detail. Elbows pinned, full lockout. Top set then back-off.'},
    {n:'Cable Biceps Curl',sr:'2 × 10-12',ld:'by feel · add a plate',q:q('cable biceps curl'),note:'Constant cable tension beats dumbbells at the top. Squeeze hard, slow negative.'}
  ]},
  {key:'lowerA',name:'Lower A',focus:'Quad lead · calves · core',sub:'Quad lead &amp; calves · all 2-set compounds = top set then −10% to failure',time:'~75',ex:[
    {n:'Back Squat',sr:'2 × 5-8',rir:'2 RIR',ld:'80 → 100kg',q:q('barbell back squat'),note:'Top set heavy, 1 rep in reserve. Back-off −10%, push for extra reps. Add weight only when 8 is clean.'},
    {n:'Romanian Deadlift',sr:'2 × 8-10',rir:'1-2 RIR',ld:'80 → 100kg',q:q('romanian deadlift'),note:'Controlled hinge, slow stretch down. Top set then −10% back-off.'},
    {n:'Leg Press (lying)',sr:'2 × 10-12',rir:'1-2 RIR',ld:'160 → 220kg',q:q('lying leg press'),note:'Knees out, pelvis down at the bottom. Breathe out as you press. Top set then back-off.'},
    {n:'Seated Leg Curl',sr:'2 × 10-12',rir:'1 RIR',ld:'by feel · add load',q:q('seated leg curl'),note:'Hamstring isolation. Slow negative — the stretch is where the growth is.'},

  var sb=document.querySelectorAll('#setMode button');for(var i=0;i<sb.length;i++)sb[i].classList.toggle('on',sb[i].getAttribute('data-sm')===setMode);
  var w=weekly();

  for(var off=1;off<=7;off++){var nw=(wd+off)%7,nk=WEEKDAY_TO_KEY[nw];if(nk){for(var i=0;i<PROGRAM.length;i++){if(PROGRAM[i].key===nk){curDay=i;return;}}}}

/* ---------- progress / tracker ---------- */
var curM='weight',MM=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fatMass(s){return s.weight*s.bf/100;}
function ffm(s){return s.weight-fatMass(s);}
function byDate(a){a.sort(function(x,y){return x.date<y.date?-1:(x.date>y.date?1:0);});}
function tgtW(){var l=STATE.scans[STATE.scans.length-1];return ffm(l)/(1-TBF/100);}
function shortD(d){var p=d.split('-');return MM[(+p[1])-1]+" '"+p[0].slice(2);}
function fullD(d){var p=d.split('-');return(+p[2])+' '+MM[(+p[1])-1]+' '+p[0];}
function wksBet(a,b){return(new Date(b)-new Date(a))/6048e5;}
function renderProgress(){
  byDate(STATE.scans);
  var L=STATE.scans[STATE.scans.length-1];
  $('pgBf').textContent=L.bf.toFixed(1)+'%';$('pgWnow').textContent=L.weight.toFixed(1);
  var tw=tgtW(),toLose=L.weight-tw;
  $('pgToGo').textContent='~'+(toLose>0.05?toLose.toFixed(1):'0')+'kg of fat to shift · about 0.5kg a week.';
  var sf=fatMass(STATE.scans[0]),tf=tw*TBF/100,prog=(sf-fatMass(L))/(sf-tf)*100;prog=Math.max(0,Math.min(100,prog));
  $('pgBar').style.width=prog.toFixed(0)+'%';var pr=$('pgRing');pr.style.strokeDasharray=RC;pr.style.strokeDashoffset=RC*(1-prog/100);
  drawM(curM);renderVerdict();renderBreakdown();renderSHist();
}
function drawM(m){curM=m;var c=document.querySelectorAll('#mchips .pill');for(var i=0;i<c.length;i++)c[i].classList.toggle('active',c[i].getAttribute('data-m')===m);var vals=STATE.scans.map(function(s){return m==='weight'?s.weight:m==='bf'?s.bf:m==='fat'?fatMass(s):(s.muscle!=null?s.muscle:null);});lineChart('mChart',vals,STATE.scans.map(function(s){return shortD(s.date);}),false);}
function lineChart(id,vals,labels,avgLine){
  var el=$(id),arr=[];vals.forEach(function(v,i){if(v!=null)arr.push({i:i,v:v});});
  if(!arr.length){el.innerHTML='<div class="empty">No data yet.</div>';return;}
  var W=320,H=158,L=14,R=14,T=18,B=24,n=vals.length;
  var vv=arr.map(function(a){return a.v;}),mn=Math.min.apply(null,vv),mx=Math.max.apply(null,vv);
  var pad=(mx-mn)*0.22||Math.max(1,mx*0.04),lo=mn-pad,hi=mx+pad;
  function X(i){return n===1?W/2:L+i*(W-L-R)/(n-1);}function Y(v){return T+(1-(v-lo)/(hi-lo))*(H-T-B);}
  var grid='';[0,0.5,1].forEach(function(g){var y=(T+g*(H-T-B)).toFixed(1);grid+='<line class="c-grid" x1="'+L+'" y1="'+y+'" x2="'+(W-R)+'" y2="'+y+'"/>';});
  var pts=arr.map(function(a){return X(a.i).toFixed(1)+','+Y(a.v).toFixed(1);});
  var avg='';if(avgLine){var av=vv.reduce(function(a,b){return a+b;},0)/vv.length,ay=Y(av).toFixed(1);avg='<line class="c-avg" x1="'+L+'" y1="'+ay+'" x2="'+(W-R)+'" y2="'+ay+'"/>';}
  var area=arr.length>1?'<path class="c-area" d="M'+X(arr[0].i).toFixed(1)+','+(H-B)+' L'+pts.join(' L')+' L'+X(arr[arr.length-1].i).toFixed(1)+','+(H-B)+' Z"/>':'';
  var line='<polyline class="c-line" points="'+pts.join(' ')+'"/>',circ='',lab='';
  arr.forEach(function(a,k){var last=k===arr.length-1;circ+='<circle class="c-pt '+(last?'last':'')+'" cx="'+X(a.i).toFixed(1)+'" cy="'+Y(a.v).toFixed(1)+'" r="'+(last?4.5:3.5)+'"/>';if(k===0||last){var _an=(arr.length>1&&k===0)?'start':(arr.length>1&&last)?'end':'middle';var _lx=_an==='start'?X(a.i)+2:_an==='end'?X(a.i)-2:X(a.i);lab+='<text class="c-v" x="'+_lx.toFixed(1)+'" y="'+(Y(a.v)-8).toFixed(1)+'" text-anchor="'+_an+'">'+a.v.toFixed(1)+'</text>';}});
  var xl='';labels.forEach(function(s,i){if(n<=6||i===0||i===n-1){var _ax=i===0?'start':i===n-1?'end':'middle';xl+='<text class="c-x" x="'+X(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="'+_ax+'">'+s+'</text>';}});
  el.innerHTML='<svg viewBox="0 0 '+W+' '+H+'" preserveAspectRatio="xMidYMid meet">'+grid+avg+area+line+circ+lab+xl+'</svg>';
}
function renderVerdict(){
  var v=$('verdict'),hint=$('vHint'),dg=$('dgrid');
  if(STATE.scans.length<2){v.className='verdict';v.innerHTML='<div class="vh"><span class="vico">i</span>First scan logged</div><div class="vd">Add next month\'s scan and this compares fat, lean and rate automatically.</div>';hint.textContent='';dg.innerHTML='';return;}
  var L=STATE.scans[STATE.scans.length-1],P=STATE.scans[STATE.scans.length-2];
  var dW=L.weight-P.weight,dF=fatMass(L)-fatMass(P),dM=(L.muscle!=null&&P.muscle!=null)?L.muscle-P.muscle:null,wk=wksBet(P.date,L.date),rate=wk>0?dW/wk:0;
  hint.textContent=wk>=1?('vs '+shortD(P.date)+' · '+Math.round(wk)+' wks'):'vs last scan';

  else if(dF>0.15){if(dM!=null&&dM>=dF){cls='good';ico='\u2713';title='Lean gain';desc='Muscle up '+dM.toFixed(1)+'kg, fat up '+dF.toFixed(1)+'kg. Good for a bulk, tighten if you meant to cut.';}else{cls='warn';ico='!';title='Fat up this month';desc='Fat rose '+dF.toFixed(1)+'kg. Recheck intake logging and steps before the next scan.';}}
  v.className='verdict '+cls;v.innerHTML='<div class="vh"><span class="vico">'+ico+'</span>'+title+'</div><div class="vd">'+desc+'</div>';

/* ── chart SVG ── */
function makeChart(){
  var scans=STATE.scans.filter(function(s){return s.weight;});
  if(scans.length<2){
    /* single point — show a flat line */
    scans=scans.length?[scans[0],scans[0]]:[{weight:92.6},{weight:92.6}];
  }
  var W=600,H=210,padx=16,top=20,bot=H-24;
  var weights=scans.map(function(s){return s.weight;});
  var minW=Math.min.apply(null,weights)-1;
  var maxW=Math.max.apply(null,weights)+1;
  var n=scans.length-1;
  function xs(i){return padx+(i/n)*(W-2*padx);}
  function ys(w){return top+(1-((w-minW)/(maxW-minW)))*(bot-top);}
  var line='',area='M'+xs(0).toFixed(1)+' '+ys(scans[0].weight).toFixed(1)+' ';
  scans.forEach(function(s,i){
    line+=(i?'L':'M')+xs(i).toFixed(1)+' '+ys(s.weight).toFixed(1)+' ';
    if(i)area+='L'+xs(i).toFixed(1)+' '+ys(s.weight).toFixed(1)+' ';
  });
  area+='L'+xs(n).toFixed(1)+' '+bot+' L'+xs(0).toFixed(1)+' '+bot+' Z';
  var dots='';
  scans.forEach(function(s,i){
    var isLast=i===scans.length-1;
    dots+='<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(s.weight).toFixed(1)+'" r="'+(isLast?5:3.2)+'" fill="'+(isLast?'#5fbf45':'#fff')+'" stroke="#5fbf45" stroke-width="2"/>';
    if(s.date){
      var label=s.date.slice(5).replace('-','/');
      dots+='<text x="'+xs(i).toFixed(1)+'" y="'+(ys(s.weight)-9).toFixed(1)+'" text-anchor="middle" font-size="11" fill="#9a9da3" font-family="JetBrains Mono,monospace">'+label+'</text>';
    }
  });
  var firstDate=scans[0].date?scans[0].date.slice(5).replace('-','/'):'start';
  var lastDate=scans[scans.length-1].date?scans[scans.length-1].date.slice(5).replace('-','/'):'now';
  var firstW=scans[0].weight.toFixed(1),lastW=scans[scans.length-1].weight.toFixed(1);
  return '<svg viewBox="0 0 600 210" style="width:100%;height:auto;display:block"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5fbf45" stop-opacity="0.22"/><stop offset="100%" stop-color="#5fbf45" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#cg)"/><path d="'+line+'" fill="none" stroke="#5fbf45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>'
    +'<div style="display:flex;justify-content:space-between;font-size:11px;color:#b3b6bc;margin-top:8px" class="mono"><span>'+firstDate+' · '+firstW+' kg</span><span>'+lastDate+' · '+lastW+' kg</span></div>';
}

  bkCard.innerHTML='<div class="infottl">Cloud sync<span class="mono fs10 mut2">JSONBIN.IO</span></div><div class="levertxt" style="margin-bottom:14px">Enter your JSONBin API key and Bin ID to push or pull your data from any device.</div><div style="display:flex;flex-direction:column;gap:10px;margin-bottom:14px"><label style="font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase">API Key<input id="cloudKeyInput" type="password" placeholder="$2a$10$…" value="'+escHtml(STATE.cloud.key||'')+'" style="display:block;width:100%;margin-top:5px;padding:10px 14px;border-radius:14px;border:1px solid var(--surface-soft);background:var(--surface-soft);color:var(--ink);font-size:13px;font-family:\'JetBrains Mono\',monospace;box-sizing:border-box" /></label><label style="font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.04em;text-transform:uppercase">Bin ID<input id="cloudBinInput" type="text" placeholder="64a3f…" value="'+escHtml(STATE.cloud.binId||'')+'" style="display:block;width:100%;margin-top:5px;padding:10px 14px;border-radius:14px;border:1px solid var(--surface-soft);background:var(--surface-soft);color:var(--ink);font-size:13px;font-family:\'JetBrains Mono\',monospace;box-sizing:border-box" /></label></div><div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px"><button class="startbtn" onclick="cloudPush()">⬆ Push</button><button class="seeall" style="height:44px;border-radius:22px;border:1px solid #ececef" onclick="cloudPull()">⬇ Pull</button></div><div id="cloudStatus" style="font-size:12px;color:var(--muted);min-height:18px">'+(STATE.cloud.lastSync?'Last sync: '+STATE.cloud.lastSync:'')+' '+(STATE.cloud.status||'')+'</div><details style="margin-top:14px"><summary style="font-size:12px;font-weight:600;color:var(--muted);cursor:pointer">How to get a free JSONBin key</summary><div class="levertxt" style="margin-top:10px">1. Go to <b>jsonbin.io</b> and create a free account.<br>2. In your dashboard, go to <b>API Keys</b> and create a new key.<br>3. Click <b>New Bin</b>, save an empty JSON — copy the Bin ID from the URL.<br>4. Paste both here and hit Push.</div></details>';
  pp2.appendChild(bkCard);
  root.appendChild(pp2);
  /* reset */
  var reset=document.createElement('div');reset.className='setrow';
  reset.innerHTML='<div><div class="sl">Reset all data</div><div class="sd">Clears everything on this device · cannot be undone.</div></div><span class="seeall" style="color:#d4574a;cursor:pointer" id="resetBtn">Reset</span>';
  root.appendChild(reset);
  /* wire accent swatches */
  var sr=root.querySelector('#swatchRow');
  ACCENTS.forEach(function(ac,i){
    var s=document.createElement('span');s.className='swatch'+(STATE.accent===i?' on':'');
    s.style.background=ac;
    s.onclick=function(){STATE.accent=i;saveState();applyAccent();go('profile');};
    sr.appendChild(s);
  });
  root.querySelector('#thLight').onclick=function(){STATE.theme='light';saveState();applyTheme();};
  root.querySelector('#thDark').onclick=function(){STATE.theme='dark';saveState();applyTheme();};
  root.querySelector('#resetBtn').onclick=function(){if(confirm('Reset all data? This cannot be undone.')){localStorage.removeItem(KEY);STATE=defState();go('home');}};
  var ki=root.querySelector('#cloudKeyInput'),bi=root.querySelector('#cloudBinInput');
  if(ki)ki.addEventListener('blur',cloudSaveInputs);
  if(bi)bi.addEventListener('blur',cloudSaveInputs);
  return root;
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', STATE.theme==='dark'?'dark':'light');
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function cloudSaveInputs(){
  var ki=$('cloudKeyInput'),bi=$('cloudBinInput');
  if(ki)STATE.cloud.key=ki.value.trim();
  if(bi)STATE.cloud.binId=bi.value.trim();
  saveState();
}
function cloudSetStatus(msg){
  STATE.cloud.status=msg;saveState();
  var el=$('cloudStatus');
  if(el)el.textContent=(STATE.cloud.lastSync?'Last sync: '+STATE.cloud.lastSync+' · ':'')+msg;
}
function cloudPush(){
  cloudSaveInputs();
  var key=STATE.cloud.key,bid=STATE.cloud.binId;
  if(!key||!bid){alert('Enter your API key and Bin ID first.');return;}
  cloudSetStatus('Pushing…');
  fetch('https://api.jsonbin.io/v3/b/'+encodeURIComponent(bid),{
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Access-Key':key,'X-Bin-Versioning':'false'},
    body:JSON.stringify(STATE)
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    var now=new Date().toLocaleString();
    STATE.cloud.lastSync=now;
    cloudSetStatus('Pushed OK · '+now);
  }).catch(function(e){cloudSetStatus('Push failed: '+e.message);});
}
function cloudPull(){
  cloudSaveInputs();
  var key=STATE.cloud.key,bid=STATE.cloud.binId;
  if(!key||!bid){alert('Enter your API key and Bin ID first.');return;}
  cloudSetStatus('Pulling…');
  fetch('https://api.jsonbin.io/v3/b/'+encodeURIComponent(bid)+'/latest',{
    headers:{'X-Access-Key':key}
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    var o=data.record||data;
    if(!o||!o.targets)throw new Error('Invalid data');
    var cloud={key:key,binId:bid,lastSync:new Date().toLocaleString(),status:''};
    STATE=Object.assign(o,{cloud:cloud});
    saveState();applyTheme();applyAccent();go('profile');
  }).catch(function(e){cloudSetStatus('Pull failed: '+e.message);});
}

/* ── exercise modal ── */
function showExModal(name,note){
  var entry=EXDB[name];if(!entry)return;
  var modal=$('exModal'),media=$('exModalMedia'),img=$('exModalImg');
  $('exModalTitle').textContent=name;
  $('exModalNote').textContent=note||'';
  img.src=entry.img;img.style.display='';
  var old=media.querySelector('.ex-gif');if(old)old.remove();
  (new Image()).src=entry.gif;
  modal.classList.add('open');
  document.body.style.overflow='hidden';
  var gif=document.createElement('img');
  gif.className='ex-gif';
  gif.src=entry.gif;
  media.appendChild(gif);
  img.style.display='none';
}
function closeExModal(){
  $('exModal').classList.remove('open');
  document.body.style.overflow='';
  var gif=$('exModal').querySelector('.ex-gif');if(gif)gif.remove();
  $('exModalImg').style.display='';
}

/* ── scan modal ── */
function showScanModal(){
  var d=new Date();
  $('scanDate').value=d.toISOString().slice(0,10);
  $('scanWeight').value='';$('scanBF').value='';$('scanMuscle').value='';
  $('scanModal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeScanModal(){
  $('scanModal').classList.remove('open');
  document.body.style.overflow='';
}
function saveScan(){
  var date=$('scanDate').value;
  var weight=parseFloat($('scanWeight').value);
  var bf=parseFloat($('scanBF').value);
  var muscle=parseFloat($('scanMuscle').value);
  if(!date||isNaN(weight)||isNaN(bf)){alert('Please enter at least a date, weight and body fat.');return;}
  var scan={date:date,weight:weight,bf:bf};
  if(!isNaN(muscle))scan.muscle=muscle;
  STATE.scans=STATE.scans.filter(function(s){return s.date!==date;});
  STATE.scans.push(scan);
  STATE.scans.sort(function(a,b){return a.date<b.date?-1:1;});
  saveState();
  closeScanModal();
  go('progress');
}
$('scanModal').addEventListener('click',function(e){if(e.target===$('scanModal'))closeScanModal();});

/* ── theme btn ── */
document.getElementById('themeBtn').onclick=function(){
  STATE.theme=(STATE.theme==='dark'?'light':'dark');
  saveState();applyTheme();
};

function syncPull(onDone){
  var c=syncGetCreds();
  if(!c.key||!c.bin){syncSetStatus('⚠ Need both Master Key and Bin ID to pull.');if(onDone)onDone(false);return;}
  syncSetStatus('Pulling…');
  fetch('https://api.jsonbin.io/v3/b/'+c.bin+'/latest',{headers:{'X-Master-Key':c.key}})
    .then(function(r){if(!r.ok)throw new Error('HTTP '+r.status);return r.json();})
    .then(function(d){
      var o=d.record;
      if(o&&o.record)o=o.record;
      if(!o||!o.targets)throw new Error('No valid data in bin');
      localStorage.setItem(SYNC_KEY_LS,c.key);
      localStorage.setItem(SYNC_BIN_LS,c.bin);
      localStorage.setItem(KEY,JSON.stringify(o));
      var _savedDay=curDay;loadState();bootRender();curDay=_savedDay;renderDayTabs();renderWorkout();syncPills();syncLoadInputs();
      var t=new Date().toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'});
      syncSetStatus('✓ Pulled at '+t+'. Data loaded from cloud.');
      toast('Synced from cloud');
      if(onDone)onDone(true);
    })
    .catch(function(err){syncSetStatus('✗ Pull failed: '+err.message);if(onDone)onDone(false);});
}

document.addEventListener('click',function(e){if(e.target.closest('[data-v="you"]'))setTimeout(syncLoadInputs,50);});
syncLoadInputs();

/* Auto-pull on page load if credentials are set */
(function(){
  var c=syncGetCreds();
  if(c.key&&c.bin){syncPull();}
})();

/* ── Pull-to-refresh ── */
(function(){
  var PTR_THRESHOLD=72;
  var indicator=document.createElement('div');
  indicator.id='ptr';
  indicator.innerHTML='<svg viewBox="0 0 24 24" width="22" height="22"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="2.5" stroke-dasharray="28 56" stroke-linecap="round"><animateTransform attributeName="transform" type="rotate" from="0 12 12" to="360 12 12" dur="0.8s" repeatCount="indefinite"/></circle></svg><span id="ptrLabel">Pull to sync</span>';
  Object.assign(indicator.style,{
    position:'fixed',top:'-64px',left:'0',right:'0',height:'64px',
    display:'flex',alignItems:'center',justifyContent:'center',gap:'8px',
    color:'var(--lime-deep)',fontSize:'13px',fontWeight:'600',
    transition:'top .2s ease',zIndex:'9999',pointerEvents:'none',
    background:'transparent'
  });
  document.body.appendChild(indicator);

  var startY=0,pulling=false,dist=0,refreshing=false;
  var label=indicator.querySelector('#ptrLabel');

  function canPull(){return(document.scrollingElement||document.documentElement).scrollTop<=0;}

  document.addEventListener('touchstart',function(e){
    if(!canPull())return;
    startY=e.touches[0].clientY;
    pulling=true;dist=0;
  },{passive:true});

  document.addEventListener('touchmove',function(e){
    if(!pulling||refreshing)return;
    dist=Math.max(0,e.touches[0].clientY-startY);
    if(dist>0){
      var progress=Math.min(dist/PTR_THRESHOLD,1);
      var show=Math.min(dist*0.5,PTR_THRESHOLD*0.5);
      indicator.style.top=(show-64)+'px';
      label.textContent=progress>=1?'Release to sync':'Pull to sync';
    }
  },{passive:true});

  document.addEventListener('touchend',function(){
    if(!pulling)return;
    pulling=false;
    if(dist>=PTR_THRESHOLD&&!refreshing){
      refreshing=true;
      indicator.style.top='0px';
      label.textContent='Syncing…';
      var c=syncGetCreds();
      if(c.key&&c.bin){
        syncPull(function(ok){
          label.textContent=ok?'✓ Synced':'✗ Sync failed';
          setTimeout(reset,1000);
        });
      } else {
        var _sd=curDay;bootRender();curDay=_sd;renderDayTabs();renderWorkout();
        label.textContent='Refreshed';
        setTimeout(reset,1200);
      }
    } else {
      reset();
    }
    dist=0;
  },{passive:true});

  function reset(){
    refreshing=false;
    indicator.style.top='-64px';
    label.textContent='Pull to sync';
  }
})();
</script>
