<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Cut</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:ital,wght@0,300..800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="liquid-glass.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--ac:#d6f23f;--lime:#d6f23f;--on-lime:#1a1c17;--bg:#eceef0;--body-bg:#e6e8eb;--surface:#fff;--surface-soft:#f3f4f6;--ink:#232427;--ink2:#2a2b2e;--muted:#8d9097;--muted2:#b3b6bc;--border:#f1f2f4}
[data-theme="dark"]{--bg:#1a1b1e;--body-bg:#111214;--surface:#242528;--surface-soft:#2e2f32;--ink:#f0f1f3;--ink2:#e4e6e9;--muted:#8d9097;--muted2:#6a6d74;--border:#2e3033}
html{background:var(--body-bg)}
body{margin:0;background:var(--body-bg)}
.app{width:100%;max-width:1560px;margin:0 auto;min-height:100vh;background:var(--bg);font-family:'Hanken Grotesk',system-ui,sans-serif;color:var(--ink);padding:22px 26px;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.ink{color:var(--ink)}.mut{color:var(--muted)}.mut2{color:var(--muted2)}.wht{color:#fff}
.mono{font-family:'JetBrains Mono',monospace}
.fs10{font-size:10px}.fs13{font-size:13px}
.lime{background:var(--ac,#d6f23f);color:#222}
.pillb{background:var(--surface-soft);color:#74767c}
.badge{display:inline-flex;align-items:center;height:22px;padding:0 10px;border-radius:11px;font-size:11.5px;font-weight:600;letter-spacing:.2px;white-space:nowrap}
.shell{display:flex;gap:22px;align-items:flex-start}
.side{width:244px;flex:none;position:sticky;top:22px;display:flex;flex-direction:column;gap:16px}
.brand{display:flex;align-items:center;gap:9px;font-size:17px;font-weight:700;letter-spacing:-.3px;padding:6px 8px 2px}
.logodot{width:17px;height:17px;border-radius:50%;background:#232427;display:inline-block}
.nav{display:flex;flex-direction:column;gap:7px}
.navitem{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:16px;padding:12px 15px;cursor:pointer;border:1px solid transparent;transition:background .15s,transform .1s}
.navitem:hover{background:var(--surface-soft);transform:translateX(2px)}
.navitem.on{background:var(--ink)}
.navitem.on .nlabel{color:#fff}
.navitem.on .nicon{color:var(--ac,#d6f23f)}
.navitem.on .nmeta{color:#8a8c90}
.ngrp{display:flex;align-items:center;gap:11px}
.nicon{color:#5b5d63;display:flex}
.nlabel{font-size:14px;font-weight:500}
.nmeta{font-size:12px;color:#a9acb2;font-weight:500}
.sidefoot{background:var(--surface);border-radius:20px;padding:16px;position:relative}
.main{flex:1;min-width:0;display:flex;flex-direction:column;gap:18px}
.topbar{display:flex;align-items:center;justify-content:space-between;min-height:42px}
.crumb{font-size:13.5px;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:9px}
.brandmob{display:none;align-items:center;gap:8px;font-size:16px;font-weight:700}
.topicons{display:flex;align-items:center;gap:10px}
.iconbtn{width:40px;height:40px;border-radius:50%;background:var(--surface);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ink)}
.avatar{width:40px;height:40px;border-radius:50%;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.laycol{display:flex;flex-direction:column;gap:18px}
.pagehead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap}
.greet{font-size:44px;font-weight:600;letter-spacing:-1.3px;line-height:1}
.subtitle{font-size:15px;color:var(--muted);margin-top:10px}
.statrow{display:flex;gap:28px;flex-wrap:wrap}
.stat{display:flex;align-items:flex-start;gap:9px}
.statnum{color:var(--ink2);font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1}
.statside{display:flex;flex-direction:column;gap:5px;padding-top:2px}
.statlabel{font-size:12.5px;color:var(--muted);font-weight:500;line-height:1.15}
.progcard{background:var(--surface);border-radius:26px;padding:22px 26px}
.progtop{display:flex;align-items:flex-start;justify-content:space-between;gap:16px}
.progbig{font-size:36px;font-weight:600;letter-spacing:-1.2px;margin:2px 0 4px;display:flex;align-items:baseline;gap:10px}
.progarrow{color:var(--muted2)}
.progunit{font-size:17px;color:var(--muted);font-weight:500}
.progbar{height:11px;border-radius:6px;background:var(--surface-soft);position:relative;margin:20px 0}
.progfill{height:100%;border-radius:6px;background:linear-gradient(90deg,#5fbf45,#bfe07a);width:33%}
.proghandle{position:absolute;left:33%;top:50%;transform:translate(-50%,-50%);width:18px;height:18px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.22);border:3px solid #5fbf45}
.progstats{display:flex;gap:46px;flex-wrap:wrap}
.pstat{display:flex;flex-direction:column;gap:7px}
.orbrow{display:grid;grid-template-columns:1fr 1fr 1.05fr;gap:16px}
.orb{position:relative;border-radius:28px;overflow:hidden;min-height:252px;padding:20px;display:flex;flex-direction:column}
.orbgreen{background:#e8ebe2}.orborange{background:#e7e8ea}
.mesh{position:absolute;inset:-25%;filter:blur(36px);z-index:0}
.blob{position:absolute;border-radius:50%}
.orbgreen .b1{width:60%;height:55%;left:18%;top:-8%;background:#f3c98a}
.orbgreen .b2{width:85%;height:70%;left:5%;top:42%;background:#74cf57}
.orbgreen .b3{width:46%;height:46%;left:48%;top:30%;background:#cfe07a}
.orborange .b1{width:75%;height:60%;left:10%;top:-10%;background:#b9c6da}
.orborange .b2{width:80%;height:62%;left:12%;top:48%;background:#f29b4e}
.orborange .b3{width:50%;height:50%;left:30%;top:30%;background:#f0c66a}
.orbinner{position:relative;z-index:1;flex:1;display:flex;flex-direction:column;align-items:center;text-align:center}
.orbtitle{font-size:14px;font-weight:500;margin-top:2px}
.orbnumwrap{flex:1;display:flex;align-items:center}
.orbnum{filter:drop-shadow(0 1px 6px rgba(0,0,0,.18));font-size:60px;font-weight:800;letter-spacing:-2px;line-height:1}
.orbsub{font-size:13px;font-weight:500;margin-bottom:6px}
.gbars{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:34px;width:100%;z-index:1;position:relative}
.gbar{width:4px;border-radius:2px;background:rgba(255,255,255,.7)}
.oticks{display:flex;align-items:flex-end;justify-content:center;gap:3px;height:38px;width:100%;z-index:1;position:relative}
.otick{width:2px;border-radius:1px;background:rgba(255,255,255,.45)}
.otick.tall{background:#fff}
.calcard{background:var(--surface);border-radius:28px;padding:20px}
.caltop{display:flex;align-items:center;justify-content:space-between}
.calgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:12px}
.calcell{aspect-ratio:1;border-radius:9px;background:var(--surface-soft);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;color:var(--muted)}
.calcell.done{background:var(--ink);color:#fff}
.calcell.today{background:var(--ac,#d6f23f);color:#222}
.calcell.rest{background:var(--surface-soft);color:var(--muted2)}
.callegend{display:flex;gap:14px;margin-top:14px;font-size:11.5px;color:var(--muted)}
.legdot{width:9px;height:9px;border-radius:3px;display:inline-block;margin-right:5px;vertical-align:middle}
.splitcard{background:var(--surface);border-radius:28px;padding:18px 22px}
.splitrow{display:flex;align-items:center;justify-content:space-between;padding:11px 2px;border-top:1px solid var(--border)}
.splitrow.first{border-top:none}
.splitday{display:flex;align-items:center;gap:12px}
.dchip{width:34px;height:34px;border-radius:10px;background:var(--surface-soft);display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#74767c;flex:none}
.dchip.on{background:var(--ink);color:var(--ac,#d6f23f)}
.splitname{font-size:14px;font-weight:600}
.splitsub{font-size:12px;color:var(--muted)}
.sectiontitle{font-size:25px;font-weight:600;letter-spacing:-.6px;line-height:1.05}
.sectionsub{font-size:13.5px;color:#9a9da3;margin-top:5px}
.sectionhead{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:2px}
.seeall{height:34px;padding:0 16px;border-radius:17px;background:var(--surface);display:inline-flex;align-items:center;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink);border:1px solid var(--border)}
.startbtn{height:44px;padding:0 22px;border-radius:22px;background:var(--ink);color:#fff;display:inline-flex;align-items:center;gap:9px;font-size:14px;font-weight:600;cursor:pointer;border:none}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.exlist{display:flex;flex-direction:column;gap:10px}
.exrow{display:flex;align-items:center;gap:15px;background:var(--surface);border-radius:20px;padding:13px 16px;cursor:pointer;transition:background .12s}
.exrow:hover{background:var(--surface-soft)}
.exidx{font-size:11px;color:#bfc3c9;font-weight:700;flex:none;font-family:'JetBrains Mono',monospace;min-width:18px}
.exthumb{width:66px;height:50px;border-radius:11px;flex:none;position:relative;overflow:hidden}
.exthumb img{width:100%;height:100%;object-fit:cover;display:block}
.exthumb.t1{background:radial-gradient(circle at 40% 32%,#bfe07a,#5fbf45)}
.exthumb.t2{background:radial-gradient(circle at 40% 32%,#cfe0f5,#6f9fd8)}
.exthumb.t3{background:radial-gradient(circle at 40% 32%,#ffd2a8,#e8763a)}
.explay{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:22px;height:22px;border-radius:50%;background:rgba(255,255,255,.85);display:flex;align-items:center;justify-content:center;color:#3a3b3e;font-size:9px}
.extext{flex:1;min-width:0}
.exname{font-size:14.5px;font-weight:600}
.exsub{font-size:12px;color:var(--muted);margin-top:2px}
.exscheme{font-family:'JetBrains Mono',monospace;font-size:12.5px;font-weight:500;color:var(--ink);white-space:nowrap}
.excheck{width:30px;height:30px;border-radius:50%;border:2px solid var(--border);flex:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:var(--muted2);background:none;transition:background .15s,border-color .15s}
.excheck.done{background:var(--ink);border-color:var(--ink);color:var(--ac,#d6f23f)}
.infocard{background:var(--surface);border-radius:22px;padding:22px}
.infottl{font-size:16px;font-weight:600;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
.bullet{display:flex;gap:11px;font-size:13px;color:var(--muted);line-height:1.45;margin-bottom:10px}
.bdot{width:6px;height:6px;border-radius:50%;background:var(--ac,#d6f23f);margin-top:6px;flex:none}
.rampchip{display:inline-flex;align-items:center;gap:8px;background:var(--surface-soft);border-radius:12px;padding:8px 13px;font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:500;margin-top:6px}
.rampchip b{color:var(--ink);font-weight:700}
.fuelhero{display:grid;grid-template-columns:1.15fr 1fr;gap:16px}
.macrolist{background:var(--surface);border-radius:26px;padding:22px 24px;display:flex;flex-direction:column;justify-content:center;gap:20px}
.macrorow{display:flex;flex-direction:column;gap:9px}
.macrotop{display:flex;align-items:baseline;justify-content:space-between}
.macroname{font-size:14px;font-weight:600}
.macropct{font-size:12px;color:var(--muted);font-weight:500}
.macrobar{height:8px;border-radius:4px;background:var(--surface-soft);overflow:hidden}
.macrofill{height:100%;border-radius:4px}
.mf-p{background:#5fbf45}.mf-c{background:#6f9fd8}.mf-f{background:#e8954e}
.planpair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.plancard{background:var(--surface);border-radius:24px;padding:20px 22px}
.planhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.plankcal{font-size:30px;font-weight:600;letter-spacing:-1px}
.planmac{display:flex;gap:22px;margin-top:14px}
.planmac div{font-size:12px;color:var(--muted)}
.planmac b{display:block;font-size:17px;color:var(--ink2);font-weight:600;margin-bottom:1px}
.meallist{display:flex;flex-direction:column;gap:10px}
.mealrow{display:flex;align-items:center;gap:15px;background:var(--surface);border-radius:20px;padding:13px 16px}
.mealblob{width:46px;height:46px;border-radius:50%;flex:none;filter:blur(1px)}
.sb-green{background:radial-gradient(circle at 38% 32%,#bfef8a,#4fae3e)}
.sb-blue{background:radial-gradient(circle at 38% 32%,#cfe0f5,#6f9fd8)}
.sb-orange{background:radial-gradient(circle at 38% 32%,#ffd2a8,#e8763a)}
.mealtext{flex:1;min-width:0}
.mealname{font-size:14.5px;font-weight:600}
.mealdesc{font-size:12px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mealright{text-align:right;flex:none}
.mealkcal{font-size:15px;font-weight:600}
.mealmac{font-size:11px;color:var(--muted);font-family:'JetBrains Mono',monospace}
.progchartcard{background:var(--surface);border-radius:26px;padding:22px 24px;display:flex;flex-direction:column}
.statgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.metcard{background:var(--surface);border-radius:20px;padding:16px;min-height:124px;display:flex;flex-direction:column;justify-content:space-between}
.mettop{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:12px;font-weight:500}
.metnum{display:flex;align-items:baseline;gap:5px;color:var(--ink2);font-size:28px;font-weight:700;letter-spacing:-.6px;line-height:1}
.metunit{font-size:11px;color:var(--muted)}
.metdelta{font-size:11.5px;font-weight:600;color:#5fae3e}
.levergrid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.levercard{background:var(--surface);border-radius:22px;padding:22px;display:flex;flex-direction:column}
.leverno{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted2);font-weight:500}
.leverttl{font-size:21px;font-weight:600;margin:12px 0 10px;letter-spacing:-.3px}
.levertxt{font-size:13px;color:var(--muted);line-height:1.5}
.leverbadge{margin-top:14px}
.phaserow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
.phasecard{position:relative;border-radius:24px;padding:22px;min-height:150px;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden;color:#fff}
.phasecard .mesh{filter:blur(34px)}
.ph1 .b2{background:#74cf57}.ph1 .b1{background:#f3c98a}
.ph2 .b2{background:#f29b4e}.ph2 .b1{background:#f0c66a}
.ph3 .b2{background:#e8763a}.ph3 .b1{background:#d98cc0}
.phasecard .blob{position:absolute;border-radius:50%;width:80%;height:70%}
.phasecard .b1{left:-10%;top:-20%}
.phasecard .b2{left:20%;top:40%}
.phno{position:relative;z-index:1;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:14px}
.phbody{position:relative;z-index:1}
.phname{font-size:19px;font-weight:600}
.phmonth{font-size:13px;opacity:.85}
.phbf{position:relative;z-index:1;font-size:22px;font-weight:700;letter-spacing:-.5px}
.refgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.setrow{display:flex;align-items:center;justify-content:space-between;background:var(--surface);border-radius:18px;padding:15px 18px}
.setrow .sl{font-size:14px;font-weight:600}
.setrow .sd{font-size:12px;color:var(--muted);margin-top:2px}
.stepper{display:flex;align-items:center;gap:14px}
.stepbtn{width:30px;height:30px;border-radius:50%;background:var(--surface-soft);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--ink);cursor:pointer;border:none;font-family:'Hanken Grotesk',sans-serif}
.stepval{font-size:16px;font-weight:600;min-width:46px;text-align:center;font-family:'JetBrains Mono',monospace}
.swatchrow{display:flex;gap:10px}
.swatch{width:34px;height:34px;border-radius:11px;cursor:pointer;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--border)}
.swatch.on{box-shadow:0 0 0 2px var(--ink)}
.bottomnav{display:none}
/* clean numerals replacing dot-matrix */
.bignum{font-family:'Hanken Grotesk',system-ui,sans-serif;font-weight:700;letter-spacing:-.04em;line-height:1}
/* projection tiles */
.projtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.weektile{background:var(--surface);border-radius:18px;padding:16px 18px;display:flex;flex-direction:column;gap:6px;transition:transform .15s}
.weektile.last{background:#f0f9e6;border:2px solid #c6e87a}
[data-theme="dark"] .weektile.last{background:#1e2b1a;border-color:#4a7a20}
.wtweek{font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted2);font-weight:500;text-transform:uppercase;letter-spacing:.3px}
.wtdate{font-size:12px;color:var(--muted);margin-bottom:2px}
.wtwt{font-size:26px;font-weight:700;letter-spacing:-.8px;color:var(--ink)}
.wtbf{font-size:13px;color:var(--muted);font-weight:500}
/* scan modal */
.scanmodal{display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.55);align-items:center;justify-content:center;padding:16px}
.scanmodal.open{display:flex}
.scansheet{background:var(--surface);border-radius:26px;width:100%;max-width:440px;padding:26px;animation:slideup .2s ease}
.scanfield{margin-bottom:14px}
.scanlabel{font-size:10px;font-weight:700;color:var(--muted);margin-bottom:6px;display:block;text-transform:uppercase;letter-spacing:.4px;font-family:'JetBrains Mono',monospace}
.scaninput{width:100%;height:48px;border-radius:13px;border:1.5px solid var(--border);background:var(--surface-soft);font-size:17px;font-family:'Hanken Grotesk',sans-serif;padding:0 14px;color:var(--ink);outline:none;transition:border-color .15s}
.scaninput:focus{border-color:var(--ac)}
.scanbtnrow{display:flex;gap:10px;margin-top:8px}
/* liquid glass tabbar overrides for this design */
.tabbar{z-index:60}
.tab{font-family:'Hanken Grotesk',system-ui,sans-serif}
.tab.active{color:var(--on-lime,#1a1c17)}
[data-theme="dark"] .tab.active{color:var(--lime,#d6f23f)}
/* ex modal */
.exmodal{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.55);align-items:flex-end;justify-content:center}
.exmodal.open{display:flex}
.exmodal-sheet{background:var(--surface);border-radius:28px 28px 0 0;width:100%;max-width:620px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;animation:slideup .25s ease}
@keyframes slideup{from{transform:translateY(100%)}to{transform:translateY(0)}}
.exmodal-head{display:flex;align-items:center;justify-content:space-between;padding:18px 20px 14px;border-bottom:1px solid var(--border)}
.exmodal-title{font-size:16px;font-weight:600}
.exmodal-note{font-size:12.5px;color:#8d9097;margin-top:3px}
.exmodal-close{width:32px;height:32px;border-radius:50%;background:var(--surface-soft);border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--muted);flex:none}
.exmodal-media{position:relative;background:var(--surface-soft);display:flex;align-items:center;justify-content:center;min-height:280px;overflow:hidden}
.exmodal-media img.ex-static{max-width:100%;max-height:320px;object-fit:contain;display:block}
.exmodal-media img.ex-gif{max-width:100%;max-height:380px;width:auto;height:auto;object-fit:contain;display:block;image-rendering:-webkit-optimize-contrast}
@media(min-width:981px){.tabbar{display:none!important}}
@media(max-width:980px){
.app{padding:14px 14px 96px}
.side{display:none}
.shell{gap:0}
.brandmob{display:flex}
.crumb{display:none}
.greet{font-size:34px}
.orbrow,.fuelhero,.twocol,.planpair{grid-template-columns:1fr}
.statgrid{grid-template-columns:1fr 1fr}
.levergrid,.phaserow,.refgrid{grid-template-columns:1fr}
.projtiles{grid-template-columns:1fr 1fr}
.exmodal-sheet{border-radius:28px 28px 0 0;max-width:100%}
}
</style>
</head>
<body>
<div class="app">
  <div class="shell">
    <aside class="side">
      <div class="brand"><span class="logodot"></span>the cut</div>
      <nav class="nav" id="sideNav"></nav>
      <div class="sidefoot">
        <span class="badge lime" style="margin-bottom:10px">Review</span>
        <div style="font-size:14.5px;font-weight:600;margin-bottom:4px">Sunday checkpoint</div>

var DEFAULT_TARGETS={weekday:{p:240,c:200,f:50},weekend:{p:240,c:130,f:50}};
var SEED_S=[{date:'2025-09-27',weight:88.9,bf:18.9,muscle:68.5},{date:'2026-05-17',weight:92.6,bf:19.2,muscle:71.1}];
var SEED_D=[{date:'2026-05-17',weight:92.6},{date:'2026-06-06',weight:93.8}];
function defState(){return{targets:clone(DEFAULT_TARGETS),maint:2900,theme:'light',accent:0,mode:'weekday',scans:clone(SEED_S),daily:clone(SEED_D),ticks:{},cloud:{key:'',binId:'',lastSync:'',status:''}};}
var STATE=defState();
function loadState(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);var d=defState();STATE={targets:o.targets&&o.targets.weekday?o.targets:d.targets,maint:o.maint||d.maint,theme:o.theme||'light',accent:o.accent||0,mode:o.mode||'weekday',scans:Array.isArray(o.scans)&&o.scans.length?o.scans:d.scans,daily:Array.isArray(o.daily)?o.daily:d.daily,ticks:o.ticks||{},cloud:o.cloud||d.cloud};}}catch(e){STATE=defState();}}
function saveState(){try{localStorage.setItem(KEY,JSON.stringify(STATE));}catch(e){}}

/* ── helpers ── */
function todayISO(){return new Date().toISOString().slice(0,10);}
function kcalOf(m){return Math.round(m.p*4+m.c*4+m.f*9);}
function fmtK(n){return Math.round(n).toLocaleString('en-GB');}
function weekly(){var wd=kcalOf(STATE.targets.weekday),we=kcalOf(STATE.targets.weekend),tot=wd*5+we*2,avg=Math.round(tot/7),def=STATE.maint-avg;return{wd:wd,we:we,avg:avg,def:def,wkRate:def*7/7700};}
function todayDayKey(){var wd=new Date().getDay();return WEEKDAY_TO_KEY[wd]||null;}
function todayProgIdx(){var k=todayDayKey();if(!k)return-1;for(var i=0;i<PROGRAM.length;i++)if(PROGRAM[i].key===k)return i;return-1;}
function doneSet(progIdx){var idx=progIdx>=0?progIdx:0;var t=STATE.ticks[todayISO()];return(t&&t.key===PROGRAM[idx].key&&Array.isArray(t.done))?t.done:[];}
function setTick(progIdx,arr){STATE.ticks[todayISO()]={key:PROGRAM[progIdx].key,done:arr};saveState();}

/* ── navigation state ── */
var PAGE='home';
var PAGES=['home','train','nutrition','progress','plan','profile'];
var BOT_DEFS=[
  {key:'home',icon:'home',label:'Home'},
  {key:'train',icon:'dumbbell',label:'Train'},
  {key:'nutrition',icon:'fork',label:'Fuel'},
  {key:'progress',icon:'chart',label:'Progress'},
  {key:'plan',icon:'plan',label:'Plan'},
  {key:'profile',icon:'user',label:'You'}
];
function getNavDefs(){
  var latestScan=STATE.scans[STATE.scans.length-1]||{};
  var todayKey=todayDayKey();
  var todayProg=null;for(var _i=0;_i<PROGRAM.length;_i++){if(PROGRAM[_i].key===todayKey){todayProg=PROGRAM[_i];break;}}
  var days=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  return [
    {key:'home',icon:'home',label:'Home',meta:days[new Date().getDay()]},
    {key:'train',icon:'dumbbell',label:'Training',meta:todayProg?todayProg.name:'Rest'},
    {key:'nutrition',icon:'fork',label:'Nutrition',meta:fmtK(kcalOf(STATE.targets[STATE.mode||'weekday']))},
    {key:'progress',icon:'chart',label:'Progress',meta:latestScan.bf?latestScan.bf.toFixed(1)+'%':'–'},
    {key:'plan',icon:'plan',label:'Plan',meta:'Establish'},
    {key:'profile',icon:'user',label:'Profile',meta:'Kay'}
  ];
}

function buildNav(){
  var sn=$('sideNav'),bn=$('bottomNav');
  sn.innerHTML='';if(bn)bn.innerHTML='';
  getNavDefs().forEach(function(d){
    var el=document.createElement('div');
    el.className='navitem'+(PAGE===d.key?' on':'');
    el.innerHTML='<div class="ngrp"><span class="nicon">'+iconHTML(d.icon)+'</span><span class="nlabel">'+d.label+'</span></div><span class="nmeta">'+d.meta+'</span>';
    el.onclick=function(){go(d.key);};
    sn.appendChild(el);
  });
  BOT_DEFS.forEach(function(d){
    var el=document.createElement('div');
    el.className='bnitem'+(PAGE===d.key?' on':'');
    el.innerHTML='<span class="nicon">'+iconHTML(d.icon)+'</span><span>'+d.label+'</span>';
    el.onclick=function(){go(d.key);};
    bn.appendChild(el);
  });
  var now=new Date();
  var days=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  var months=['January','February','March','April','May','June','July','August','September','October','November','December'];
  $('topCrumb').textContent=days[now.getDay()]+' · '+now.getDate()+' '+months[now.getMonth()];
}

function go(p){
  PAGE=p;
  buildNav();
  renderPage();
  /* sync liquid glass tabbar */
  var tabs=document.querySelectorAll('.tabbar .tab');
  tabs.forEach(function(t){t.classList.toggle('active',t.getAttribute('data-v')===p);});
  if(window._dockSnap)window._dockSnap();
}
window.showView=function(v){go(v);};

/* ── random gen (seeded) ── */
function rnd(s){var x=Math.sin(s)*10000;return x-Math.floor(x);}
function greenBarsHTML(){
  var h='';for(var i=0;i<22;i++)h+='<div class="gbar" style="height:'+(6+Math.round(rnd(i*4+1)*26))+'px"></div>';return h;
}
function orangeTicksHTML(){
  var h='';for(var i=0;i<44;i++){var tall=i===30;h+='<div class="otick'+(tall?' tall':'')+'" style="height:'+(tall?34:(8+Math.round(rnd(i*3+2)*16)))+'px"></div>';}return h;
}

/* ── orb helpers ── */
function makeOrb(cls,titleTxt,numEl,subTxt,vizEl){
  var d=document.createElement('div');d.className='orb '+cls;
  var mesh=document.createElement('div');mesh.className='mesh';
  mesh.innerHTML='<span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>';
  d.appendChild(mesh);
  var inner=document.createElement('div');inner.className='orbinner';
  var title=document.createElement('div');title.className='orbtitle wht';title.textContent=titleTxt;
  var numwrap=document.createElement('div');numwrap.className='orbnumwrap';
  var numDiv=document.createElement('div');numDiv.className='orbnum wht';
  if(numEl)numDiv.appendChild(numEl);
  numwrap.appendChild(numDiv);
  var sub=document.createElement('div');sub.className='orbsub wht';sub.textContent=subTxt;
  inner.appendChild(title);inner.appendChild(numwrap);inner.appendChild(sub);
  if(vizEl)inner.appendChild(vizEl);
  d.appendChild(inner);
  return d;
}
function orbGreen(titleTxt,numEl,subTxt){
  var viz=document.createElement('div');viz.className='gbars';viz.innerHTML=greenBarsHTML();
  return makeOrb('orbgreen',titleTxt,numEl,subTxt,viz);
}
function orbOrange(titleTxt,numEl,subTxt){
  var viz=document.createElement('div');viz.className='oticks';viz.innerHTML=orangeTicksHTML();
  return makeOrb('orborange',titleTxt,numEl,subTxt,viz);
}

/* ── chart SVG ── */
function makeChart(){
  var weeks=[[0,92.8],[1,92.29],[2,91.68],[3,91.07],[4,90.45],[5,89.84],[6,89.23],[7,88.62],[8,88.0],[9,87.5]];
  var W=600,H=210,padx=16,top=20,bot=H-24,minW=87,maxW=93.2;
  function xs(i){return padx+(i/9)*(W-2*padx);}
  function ys(w){return top+(1-((w-minW)/(maxW-minW)))*(bot-top);}
  var line='',area='M'+xs(0).toFixed(1)+' '+ys(weeks[0][1]).toFixed(1)+' ';
  weeks.forEach(function(p,i){line+=(i?'L':'M')+xs(i).toFixed(1)+' '+ys(p[1]).toFixed(1)+' ';if(i)area+='L'+xs(i).toFixed(1)+' '+ys(p[1]).toFixed(1)+' ';});
  area+='L'+xs(9).toFixed(1)+' '+bot+' L'+xs(0).toFixed(1)+' '+bot+' Z';
  var dots='';weeks.forEach(function(p,i){dots+='<circle cx="'+xs(i).toFixed(1)+'" cy="'+ys(p[1]).toFixed(1)+'" r="'+(i===9?5:3.2)+'" fill="'+(i===9?'#5fbf45':'#fff')+'" stroke="#5fbf45" stroke-width="2"/>';});
  return '<svg viewBox="0 0 600 210" style="width:100%;height:auto;display:block"><defs><linearGradient id="cg" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="#5fbf45" stop-opacity="0.22"/><stop offset="100%" stop-color="#5fbf45" stop-opacity="0"/></linearGradient></defs><path d="'+area+'" fill="url(#cg)"/><path d="'+line+'" fill="none" stroke="#5fbf45" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>'+dots+'</svg>';
}

/* ── pages ── */
function renderPage(){
  var p=$('pages');
  if(!p)return;
  p.innerHTML='';
  try{
    switch(PAGE){
      case 'home': p.appendChild(renderHome());break;
      case 'train': p.appendChild(renderTrain());break;
      case 'nutrition': p.appendChild(renderNutrition());break;
      case 'progress': p.appendChild(renderProgress());break;
      case 'plan': p.appendChild(renderPlan());break;
      case 'profile': p.appendChild(renderProfile());break;
    }
  }catch(err){
    p.innerHTML='<div style="padding:24px;color:#d4574a;font-family:monospace;font-size:13px;background:#fff2f2;border-radius:16px;margin:16px 0"><b>Render error ('+PAGE+'):</b><br>'+err.message+'<br><pre>'+err.stack+'</pre></div>';
  }
}

function applyTheme(){
  document.documentElement.setAttribute('data-theme', STATE.theme==='dark'?'dark':'light');
}

function escHtml(s){return String(s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;');}

function cloudSaveInputs(){
  var ki=$('cloudKeyInput'),bi=$('cloudBinInput');
  if(ki)STATE.cloud.key=ki.value.trim();
  if(bi)STATE.cloud.binId=bi.value.trim();
  saveState();
}
function cloudSetStatus(msg){
  STATE.cloud.status=msg;saveState();
  var el=$('cloudStatus');
  if(el)el.textContent=(STATE.cloud.lastSync?'Last sync: '+STATE.cloud.lastSync+' · ':'')+msg;
}
function cloudPush(){
  cloudSaveInputs();
  var key=STATE.cloud.key,bid=STATE.cloud.binId;
  if(!key||!bid){alert('Enter your API key and Bin ID first.');return;}
  cloudSetStatus('Pushing…');
  fetch('https://api.jsonbin.io/v3/b/'+encodeURIComponent(bid),{
    method:'PUT',
    headers:{'Content-Type':'application/json','X-Access-Key':key,'X-Bin-Versioning':'false'},
    body:JSON.stringify(STATE)
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    var now=new Date().toLocaleString();
    STATE.cloud.lastSync=now;
    cloudSetStatus('Pushed OK · '+now);
  }).catch(function(e){cloudSetStatus('Push failed: '+e.message);});
}
function cloudPull(){
  cloudSaveInputs();
  var key=STATE.cloud.key,bid=STATE.cloud.binId;
  if(!key||!bid){alert('Enter your API key and Bin ID first.');return;}
  cloudSetStatus('Pulling…');
  fetch('https://api.jsonbin.io/v3/b/'+encodeURIComponent(bid)+'/latest',{
    headers:{'X-Access-Key':key}
  }).then(function(r){
    if(!r.ok)throw new Error('HTTP '+r.status);
    return r.json();
  }).then(function(data){
    var o=data.record||data;
    if(!o||!o.targets)throw new Error('Invalid data');
    var cloud={key:key,binId:bid,lastSync:new Date().toLocaleString(),status:''};
    STATE=Object.assign(o,{cloud:cloud});
    saveState();applyTheme();applyAccent();go('profile');
  }).catch(function(e){cloudSetStatus('Pull failed: '+e.message);});
}

function exportData(){
  var blob=new Blob([JSON.stringify(STATE,null,2)],{type:'application/json'});
  var a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='thecut-backup.json';a.click();
}
function importData(){
  var inp=document.createElement('input');inp.type='file';inp.accept='.json,application/json';
  inp.onchange=function(e){
    var f=e.target.files[0];if(!f)return;
    var fr=new FileReader();fr.onload=function(ev){try{var o=JSON.parse(ev.target.result);if(o&&o.targets){STATE=o;saveState();go('home');}}catch(err){alert('Invalid file.');}};
    fr.readAsText(f);
  };
  inp.click();
}

/* ── exercise modal ── */
function showExModal(name,note){
  var entry=EXDB[name];if(!entry)return;
  var modal=$('exModal'),media=$('exModalMedia'),img=$('exModalImg');
  $('exModalTitle').textContent=name;
  $('exModalNote').textContent=note||'';
  img.src=entry.img;img.style.display='';
  var old=media.querySelector('.ex-gif');if(old)old.remove();
  (new Image()).src=entry.gif;
  modal.classList.add('open');
  document.body.style.overflow='hidden';
  var gif=document.createElement('img');
  gif.className='ex-gif';
  gif.src=entry.gif;
  media.appendChild(gif);
  img.style.display='none';
}
function closeExModal(){
  $('exModal').classList.remove('open');
  document.body.style.overflow='';
  var gif=$('exModal').querySelector('.ex-gif');if(gif)gif.remove();
  $('exModalImg').style.display='';
}

/* ── scan modal ── */
function showScanModal(){
  var d=new Date();
  $('scanDate').value=d.toISOString().slice(0,10);
  $('scanWeight').value='';$('scanBF').value='';$('scanMuscle').value='';
  $('scanModal').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeScanModal(){
  $('scanModal').classList.remove('open');
  document.body.style.overflow='';
}
function saveScan(){
  var date=$('scanDate').value;
  var weight=parseFloat($('scanWeight').value);
  var bf=parseFloat($('scanBF').value);
  var muscle=parseFloat($('scanMuscle').value);
  if(!date||isNaN(weight)||isNaN(bf)){alert('Please enter at least a date, weight and body fat.');return;}
  var scan={date:date,weight:weight,bf:bf};
  if(!isNaN(muscle))scan.muscle=muscle;
  STATE.scans=STATE.scans.filter(function(s){return s.date!==date;});
  STATE.scans.push(scan);
  STATE.scans.sort(function(a,b){return a.date<b.date?-1:1;});
  saveState();
  closeScanModal();
  go('progress');
}
$('scanModal').addEventListener('click',function(e){if(e.target===$('scanModal'))closeScanModal();});

/* ── theme btn ── */
document.getElementById('themeBtn').onclick=function(){
  STATE.theme=(STATE.theme==='dark'?'light':'dark');
  saveState();applyTheme();
};

/* ── modal events ── */
$('exModalClose').addEventListener('click',closeExModal);
$('exModal').addEventListener('click',function(e){if(e.target===$('exModal'))closeExModal();});

/* ── init ── */
loadState();
applyAccent();
applyTheme();
curTrainDay=todayProgIdx()>=0?todayProgIdx():1;
buildNav();
renderPage();
/* sync tabbar to current page on load */
window.addEventListener('DOMContentLoaded',function(){
  var tabs=document.querySelectorAll('.tabbar .tab');
  tabs.forEach(function(t){t.classList.toggle('active',t.getAttribute('data-v')===PAGE);});
});
</script>
